<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Dự Án & Duyệt Ứng Viên - HT Work</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', '-apple-system', 'BlinkMacSystemFont', '"Segoe UI"', 'Roboto', 'sans-serif'],
                    },
                    colors: {
                        primary: '#4f46e5',
                        dark: '#111827',
                        darkCard: '#1f2937'
                    }
                }
            }
        }
    </script>
    <style>
        * { font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    </style>
</head>
<body class="bg-gray-50 dark:bg-gray-900 transition-colors text-gray-800 dark:text-gray-100 h-screen flex overflow-hidden font-sans">
    <!-- Sidebar Placeholder -->
    <div id="sidebar-container"></div>
    
    <!-- Main Wrapper -->
    <div class="flex-1 flex flex-col overflow-hidden">
        <!-- Header Placeholder -->
        <div id="header-container"></div>
        
        <!-- Main Content -->
        <main class="flex-1 overflow-y-auto p-4 sm:p-6 md:p-8 pb-24 md:pb-10 max-w-5xl mx-auto w-full relative">
            
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-8">
                <div>
                    <h1 class="text-2xl sm:text-3xl font-extrabold text-gray-900 dark:text-white flex items-center">
                        <i class="fas fa-tasks mr-3 text-indigo-600"></i> Quản Lý Yêu Cầu & Duyệt Ứng Viên
                    </h1>
                    <p class="text-xs sm:text-sm text-gray-500 dark:text-gray-400 mt-1">Xem xét hồ sơ báo giá từ Freelancer, chốt thuê và Khóa Escrow an toàn.</p>
                </div>
                <div class="flex items-center space-x-3">
                    <button onclick="loadMyRequests()" class="bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 text-gray-700 dark:text-gray-200 hover:bg-gray-50 px-4 py-2.5 rounded-xl text-xs font-bold shadow-sm transition flex items-center">
                        <i class="fas fa-sync-alt mr-2 text-indigo-500"></i> Làm mới
                    </button>
                    <a href="post-job.html" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold px-5 py-2.5 rounded-xl text-xs shadow-md transition flex items-center">
                        <i class="fas fa-plus-circle mr-2"></i> Đăng Yêu Cầu Mới
                    </a>
                </div>
            </div>
            
            <!-- Danh sách bài đăng & Ứng viên -->
            <div id="requestsList" class="space-y-6">
                <div class="text-center py-16 text-gray-400">
                    <i class="fas fa-spinner fa-spin mr-2"></i> Đang tải danh sách yêu cầu...
                </div>
            </div>
        </main>
    </div>

    <!-- Shared UI Script -->
    <script src="ui.js"></script>

    <script>
        const API_URL = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' 
            ? 'http://localhost:5000' 
            : 'https://htwork-backend.onrender.com';

        let currentUser = null;
        let myJobsList = [];
        let allApplications = [];

        async function loadMyRequests() {
            const userStr = localStorage.getItem('user');
            if (!userStr) {
                window.location.replace('../sharedFolder/login.html');
                return;
            }
            currentUser = JSON.parse(userStr);

            const listDiv = document.getElementById('requestsList');
            listDiv.innerHTML = '<div class="text-center py-16 text-gray-400"><i class="fas fa-spinner fa-spin mr-2"></i> Đang tải dữ liệu...</div>';

            try {
                // Tải song song Jobs và Applications
                const [jobsRes, appsRes] = await Promise.all([
                    fetch(`${API_URL}/api/client/${currentUser.id}/my-jobs`),
                    fetch(`${API_URL}/api/client/${currentUser.id}/applications`)
                ]);

                const jobsData = await jobsRes.json();
                const appsData = await appsRes.json();

                myJobsList = jobsData.jobs || [];
                allApplications = appsData.applications || [];

                if (myJobsList.length === 0) {
                    listDiv.innerHTML = `
                        <div class="bg-white dark:bg-gray-800 rounded-3xl p-12 text-center border border-gray-200 dark:border-gray-700 shadow-sm">
                            <span class="text-5xl">📋</span>
                            <h3 class="text-lg font-extrabold text-gray-900 dark:text-white mt-3">Bạn chưa đăng bất kỳ yêu cầu nào</h3>
                            <p class="text-xs text-gray-500 mt-1 mb-6">Hãy đăng yêu cầu công việc để bắt đầu kết nối với các chuyên gia Freelancer hàng đầu.</p>
                            <a href="post-job.html" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold px-6 py-3 rounded-xl text-sm shadow-md transition inline-flex items-center">
                                <i class="fas fa-plus mr-2"></i> Đăng Yêu Cầu Đầu Tiên
                            </a>
                        </div>
                    `;
                    return;
                }

                renderJobsWithApplicants();
            } catch (err) {
                listDiv.innerHTML = `<div class="text-center py-12 text-red-500 font-bold">Lỗi kết nối Server: ${err.message}</div>`;
            }
        }

        function renderJobsWithApplicants() {
            const listDiv = document.getElementById('requestsList');

            listDiv.innerHTML = myJobsList.map(job => {
                // Lọc danh sách ứng viên cho job này
                const jobApps = allApplications.filter(a => a.job_id === job.id);
                
                let statusBadge = '';
                let statusBorder = 'border-gray-200 dark:border-gray-700';

                if (job.status === 'open') {
                    statusBadge = '<span class="bg-emerald-100 text-emerald-800 text-xs font-black px-3 py-1 rounded-full border border-emerald-300">ĐANG MỞ ĐẤU THẦU</span>';
                    statusBorder = 'border-l-4 border-emerald-500';
                } else if (job.status === 'planning') {
                    statusBadge = '<span class="bg-yellow-100 text-yellow-800 text-xs font-black px-3 py-1 rounded-full border border-yellow-300">ĐANG LẬP KẾ HOẠCH</span>';
                    statusBorder = 'border-l-4 border-yellow-500';
                } else if (job.status === 'pending_plan_approval') {
                    statusBadge = '<span class="bg-orange-100 text-orange-800 text-xs font-black px-3 py-1 rounded-full border border-orange-300">CHỜ DUYỆT PLAN</span>';
                    statusBorder = 'border-l-4 border-orange-500';
                } else if (job.status === 'in_progress') {
                    statusBadge = '<span class="bg-blue-100 text-blue-800 text-xs font-black px-3 py-1 rounded-full border border-blue-300">ĐANG TRIỂN KHAI</span>';
                    statusBorder = 'border-l-4 border-blue-500';
                } else if (job.status === 'completed') {
                    statusBadge = '<span class="bg-purple-100 text-purple-800 text-xs font-black px-3 py-1 rounded-full border border-purple-300">ĐÃ HOÀN THÀNH</span>';
                    statusBorder = 'border-l-4 border-purple-500';
                } else if (job.status === 'cancelled') {
                    statusBadge = '<span class="bg-red-100 text-red-800 text-xs font-black px-3 py-1 rounded-full border border-red-300">ĐÃ THU HỒI / HỦY</span>';
                    statusBorder = 'border-l-4 border-red-400';
                } else {
                    statusBadge = `<span class="bg-gray-100 text-gray-800 text-xs font-black px-3 py-1 rounded-full">${job.status.toUpperCase()}</span>`;
                }

                // Render danh sách ứng viên HTML
                let applicantsHtml = '';
                if (job.status === 'open') {
                    if (jobApps.length > 0) {
                        applicantsHtml = `
                            <div class="mt-5 pt-4 border-t border-gray-100 dark:border-gray-700">
                                <h4 class="font-bold text-xs uppercase tracking-wider text-indigo-600 dark:text-indigo-400 mb-3 flex items-center">
                                    <i class="fas fa-user-check mr-2"></i> Danh Sách Ứng Viên Nộp Báo Giá (${jobApps.length})
                                </h4>
                                <div class="space-y-3">
                                    ${jobApps.map(app => {
                                        const freeName = app.users ? app.users.full_name : 'Freelancer';
                                        const freeEmail = app.users ? app.users.email : '';
                                        const avatar = `https://ui-avatars.com/api/?name=${encodeURIComponent(freeName)}&background=4f46e5&color=fff`;
                                        const bidVal = parseFloat(app.bid_amount || job.budget).toLocaleString();

                                        return `
                                        <div class="bg-gray-50 dark:bg-gray-750 p-4 rounded-2xl border border-gray-200 dark:border-gray-700 flex flex-col md:flex-row justify-between items-start md:items-center gap-3">
                                            <div class="flex items-start space-x-3">
                                                <img src="${avatar}" class="w-10 h-10 rounded-xl object-cover border shrink-0">
                                                <div>
                                                    <div class="flex items-center space-x-2">
                                                        <h5 class="font-bold text-gray-900 dark:text-white text-sm">${freeName}</h5>
                                                        <span class="text-xs text-gray-400">${freeEmail}</span>
                                                    </div>
                                                    <p class="text-xs text-gray-600 dark:text-gray-300 mt-1 leading-relaxed"><i class="fas fa-quote-left text-gray-400 mr-1"></i>${app.cover_letter || 'Freelancer nộp hồ sơ ứng tuyển.'}</p>
                                                </div>
                                            </div>
                                            <div class="flex items-center justify-between w-full md:w-auto space-x-3 shrink-0 pt-2 md:pt-0 border-t md:border-t-0 border-gray-200">
                                                <div class="text-right">
                                                    <span class="text-[10px] text-gray-400 font-bold uppercase block">Báo giá</span>
                                                    <span class="font-extrabold text-emerald-600 text-sm">💎 ${bidVal} Token</span>
                                                </div>
                                                <button onclick="acceptFreelancer('${app.id}', '${job.id}', '${bidVal}', '${freeName.replace(/'/g, "\\'")}')" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-4 py-2 rounded-xl text-xs shadow-md transition flex items-center whitespace-nowrap">
                                                    <i class="fas fa-check-circle mr-1.5"></i> Chọn & Khóa Escrow
                                                </button>
                                            </div>
                                        </div>
                                        `;
                                    }).join('')}
                                </div>
                            </div>
                        `;
                    } else {
                        applicantsHtml = `
                            <div class="mt-4 pt-4 border-t border-gray-100 dark:border-gray-700 flex flex-col sm:flex-row justify-between items-center text-xs text-gray-500">
                                <span><i class="fas fa-info-circle mr-1.5 text-blue-500"></i> Chưa có ứng viên nộp hồ sơ cho dự án này.</span>
                                <a href="home.html" class="mt-2 sm:mt-0 font-bold text-indigo-600 hover:underline flex items-center">
                                    <i class="fas fa-search mr-1"></i> Sang Chợ Nhân Sự mời Freelancer →
                                </a>
                            </div>
                        `;
                    }
                } else if (job.status === 'planning' || job.status === 'pending_plan_approval') {
                    const isPendingPlan = job.status === 'pending_plan_approval';
                    const noticeText = isPendingPlan 
                        ? 'Freelancer đã nộp Bảng Kế Hoạch. Bạn có thể kiểm tra chi tiết, duyệt hoặc thu hồi nếu không phù hợp.'
                        : 'Freelancer đang xây dựng kế hoạch Milestones. Nếu Freelancer chậm phản hồi hoặc không gửi kế hoạch, bạn có thể Thu Hồi và nhận lại 100% Token ngay.';

                    applicantsHtml = `
                        <div class="mt-4 pt-4 border-t border-amber-200 dark:border-amber-900/60 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 bg-amber-50/70 dark:bg-amber-950/20 p-3.5 rounded-2xl">
                            <div class="space-y-0.5">
                                <span class="text-xs font-bold text-amber-900 dark:text-amber-200 flex items-center gap-1.5">
                                    <i class="fas fa-shield-alt text-amber-600"></i> ${noticeText}
                                </span>
                                <span class="text-[11px] text-amber-700 dark:text-amber-400 block">
                                    💰 Tiền ký quỹ: <strong class="text-indigo-600 dark:text-indigo-400 font-bold">${parseFloat(job.budget).toLocaleString()} Token</strong> đang đóng băng an toàn trong ví Escrow.
                                </span>
                            </div>
                            <div class="flex items-center space-x-2 shrink-0 w-full sm:w-auto justify-end">
                                <button onclick="cancelPlanningJob('${job.id}', '${job.title.replace(/'/g, "\\'")}', '${parseFloat(job.budget)}')" class="px-3.5 py-2 bg-red-50 hover:bg-red-100 text-red-600 dark:bg-red-950/60 dark:text-red-300 dark:hover:bg-red-900/80 font-bold rounded-xl text-xs transition border border-red-200 dark:border-red-900 flex items-center gap-1.5 shadow-2xs" title="Thu hồi dự án và nhận lại 100% Token Escrow">
                                    <i class="fas fa-undo"></i> <span>Thu Hồi (Hoàn ${parseFloat(job.budget).toLocaleString()} Token)</span>
                                </button>
                                <a href="review-work.html" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-xl text-xs font-bold transition shadow-sm flex items-center gap-1.5">
                                    <i class="fas fa-clipboard-list"></i> <span>Xem Tiến Độ</span> →
                                </a>
                            </div>
                        </div>
                    `;
                } else if (job.status === 'cancelled') {
                    applicantsHtml = `
                        <div class="mt-4 pt-4 border-t border-gray-100 dark:border-gray-700 flex justify-between items-center text-xs text-gray-500">
                            <span class="text-red-600 font-bold flex items-center gap-1">
                                <i class="fas fa-ban text-xs"></i> Dự án đã thu hồi & toàn bộ Token ký quỹ đã được hoàn về ví.
                            </span>
                            <span class="text-xs text-gray-400">Đã kết thúc</span>
                        </div>
                    `;
                } else {
                    applicantsHtml = `
                        <div class="mt-4 pt-4 border-t border-gray-100 dark:border-gray-700 flex justify-between items-center text-xs">
                            <span class="text-indigo-600 font-bold"><i class="fas fa-lock mr-1.5"></i> Dự án đang trong quy trình thực hiện & nghiệm thu từng mốc.</span>
                            <a href="review-work.html" class="bg-indigo-50 text-indigo-700 px-3.5 py-1.5 rounded-xl font-bold hover:bg-indigo-100 transition">
                                Xem Tiến Độ & Milestones →
                            </a>
                        </div>
                    `;
                }

                return `
                <div class="bg-white dark:bg-gray-800 rounded-3xl p-6 shadow-sm border border-gray-200 dark:border-gray-700 ${statusBorder} hover:shadow-md transition">
                    <div class="flex flex-col sm:flex-row justify-between items-start gap-3">
                        <div>
                            <h2 class="text-xl font-black text-gray-900 dark:text-white">${job.title}</h2>
                            <div class="flex items-center space-x-3 text-xs text-gray-400 mt-1">
                                <span><i class="fas fa-calendar-alt mr-1"></i> Đăng ngày: ${new Date(job.created_at).toLocaleDateString('vi-VN')}</span>
                                <span>•</span>
                                <span class="font-bold text-emerald-600"><i class="fas fa-gem mr-1"></i> Ngân sách: ${parseFloat(job.budget).toLocaleString()} Token</span>
                            </div>
                        </div>
                        ${statusBadge}
                    </div>

                    <!-- Nội dung mô tả -->
                    <div class="mt-3 text-xs sm:text-sm text-gray-600 dark:text-gray-300 leading-relaxed line-clamp-2" id="desc-${job.id}">
                        ${job.description}
                    </div>

                    <!-- Khu vực Ứng viên / Tiến độ -->
                    ${applicantsHtml}
                </div>
                `;
            }).join('');
        }

        // Chấp nhận Freelancer & Khóa Escrow
        async function acceptFreelancer(applicationId, jobId, bidVal, freeName) {
            if (!confirm(`Bạn có chắc chắn muốn chọn ${freeName} với mức giá ${bidVal} Token?\n\nSố tiền này sẽ được TẠM KHÓA (ESCROW) an toàn trong ví của bạn cho đến khi nghiệm thu.`)) {
                return;
            }

            try {
                const res = await fetch(`${API_URL}/api/jobs/accept-freelancer`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        client_id: currentUser.id,
                        application_id: applicationId
                    })
                });

                const data = await res.json();
                if (res.ok) {
                    alert('🎉 Chúc mừng! Đã khóa Escrow và chọn Freelancer thành công. Dự án đã chuyển sang giai đoạn Lập Kế Hoạch (Milestones).');
                    loadMyRequests();
                } else {
                    alert('Lỗi: ' + (data.error || 'Không thể chọn ứng viên'));
                }
            } catch (err) {
                alert('Lỗi kết nối: ' + err.message);
            }
        }

        // Thu hồi dự án & Hoàn Token Escrow về ví Client
        async function cancelPlanningJob(jobId, jobTitle, budget) {
            const formattedBudget = parseFloat(budget).toLocaleString();
            if (!confirm(`Bạn có chắc chắn muốn THU HỒI dự án:\n"${jobTitle}"?\n\n💰 Toàn bộ ${formattedBudget} Token ký quỹ Escrow sẽ được HOÀN TRẢ NGAY LẬP TỨC vào số dư ví khả dụng của bạn.`)) {
                return;
            }

            try {
                const res = await fetch(`${API_URL}/api/jobs/cancel-planning`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        client_id: currentUser.id,
                        job_id: jobId
                    })
                });

                const data = await res.json();
                if (res.ok && data.success) {
                    alert('🎉 ' + (data.message || `Đã thu hồi dự án và hoàn trả ${formattedBudget} Token vào ví thành công!`));
                    await loadMyRequests();
                } else {
                    alert('Lỗi: ' + (data.error || 'Không thể thu hồi dự án'));
                }
            } catch (err) {
                alert('Lỗi kết nối Server: ' + err.message);
            }
        }

        loadMyRequests();
    </script>
</body>
</html>
