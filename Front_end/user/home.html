<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Client Portal - HT Work</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-blue-50 h-screen flex flex-col">
    <nav class="bg-blue-600 p-4 text-white flex justify-between shadow-md">
        <div class="font-bold flex items-center space-x-4">
            <a href="home.html" class="hover:text-blue-200">HT Work - Client Portal</a>
            <span class="text-blue-300">|</span>
            <a href="profile.html" class="font-medium hover:text-blue-200 underline">Hồ sơ của tôi</a>
        </div>
        <div>
            <span id="clientName" class="mr-4 font-medium"></span>
            <button id="logoutBtn" class="bg-blue-800 px-3 py-1 rounded">Đăng xuất</button>
        </div>
    </nav>
    <main class="p-10">
        <div class="bg-white p-6 rounded-lg shadow border-l-4 border-blue-500">
            <h2 class="text-2xl font-bold text-gray-800">Dự án của tôi</h2>
            <div class="mt-4 flex flex-wrap gap-4">
                <a href="wallet.html" class="bg-indigo-600 text-white px-4 py-2 rounded hover:bg-indigo-700 inline-block">Quản lý Ví (Nạp Token)</a>
                <a href="post-job.html" class="bg-green-500 text-white px-4 py-2 rounded hover:bg-green-600 inline-block">+ Đăng Yêu Cầu Mới</a>
                <a href="my-requests.html" class="bg-purple-600 text-white px-4 py-2 rounded hover:bg-purple-700 inline-block">Yêu Cầu Của Tôi (Đã đăng)</a>
                <a href="escrow-test.html" class="bg-yellow-500 text-white px-4 py-2 rounded hover:bg-yellow-600 inline-block">Mô phỏng Khóa Escrow</a>
                <a href="review-work.html" class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600 inline-block">Nghiệm thu & Giải ngân</a>
            </div>
        </div>

        <!-- Cột Thông báo -->
        <div class="mt-8 bg-white p-6 rounded-lg shadow border-l-4 border-yellow-400">
            <h2 class="text-xl font-bold text-gray-800 mb-4 flex items-center">
                🔔 Thông báo mới nhất
            </h2>
            <div id="notificationsList" class="space-y-3">
                <p class="text-gray-500 text-sm">Đang tải thông báo...</p>
            </div>
        </div>
    </main>
    <script>
        const API_URL = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' 
            ? 'http://localhost:5000' 
            : 'https://htwork-backend.onrender.com';
    console.log("Đang kiểm tra quyền truy cập vào Client Portal...");
    const userStr = localStorage.getItem('user');
    
    if (!userStr) {
        console.warn("Chưa đăng nhập -> Bị đá về Login");
        window.location.replace('../sharedFolder/login.html');
    } else {
        const user = JSON.parse(userStr);
        console.log("User hợp lệ, role là:", user.role);

        // NẾU ROLE KHÔNG PHẢI LÀ CLIENT -> BẮT BUỘC XÓA DỮ LIỆU RỒI MỚI ĐÁ RA NGOÀI
        if (user.role !== 'client') {
            console.error("Sai quyền! Đang là", user.role, "nhưng trang này cần client");
            alert("Bạn không có quyền truy cập trang này!");
            localStorage.removeItem('user'); // Dòng này cực kỳ quan trọng để cắt vòng lặp
            window.location.replace('../sharedFolder/login.html');
        } else {
            // Hợp lệ, cho vào nhà
            document.getElementById('clientName').textContent = user.full_name;
            loadNotifications(user.id);
        }
    }

    // Load Notifications
    async function loadNotifications(userId) {
        const notiDiv = document.getElementById('notificationsList');
        try {
            const res = await fetch(`${API_URL}/api/notifications/${userId}`);
            const data = await res.json();
            if (data.notifications && data.notifications.length > 0) {
                notiDiv.innerHTML = data.notifications.map(n => `
                    <div class="p-3 bg-gray-50 rounded border border-gray-100">
                        <strong class="block text-gray-800">${n.title}</strong>
                        <span class="text-gray-600 text-sm">${n.content}</span>
                        <div class="text-xs text-gray-400 mt-1">${new Date(n.created_at).toLocaleString('vi-VN')}</div>
                    </div>
                `).join('');
            } else {
                notiDiv.innerHTML = '<p class="text-gray-500 text-sm">Không có thông báo nào.</p>';
            }
        } catch(err) {
            notiDiv.innerHTML = '<p class="text-red-500 text-sm">Lỗi tải thông báo.</p>';
        }
    }

    // Xử lý nút đăng xuất
    document.getElementById('logoutBtn').addEventListener('click', () => { 
        localStorage.clear(); 
        window.location.replace('../sharedFolder/login.html'); 
    });
</script>
</body>
</html>
