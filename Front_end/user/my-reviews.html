<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HT Work - Đánh giá của tôi</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased overflow-hidden">
    <!-- Navbar (sẽ được inject bởi ui.js) -->
    <div id="navbar-container"></div>
    <div class="flex h-[calc(100vh-64px)] overflow-hidden relative">
        <!-- Sidebar -->
        <div id="sidebar-container" class="h-full"></div>
        <div id="mobile-sidebar-container"></div>
        <!-- Main Content -->
        <main class="flex-1 overflow-y-auto bg-gray-50/50 p-4 md:p-6 lg:p-8" id="main-content">
            <div class="max-w-5xl mx-auto space-y-6">
                <!-- Header -->
                <div class="flex flex-col sm:flex-row sm:items-end justify-between gap-4 bg-white p-5 rounded-2xl shadow-sm border border-gray-100">
                    <div>
                        <h1 class="text-2xl font-black text-gray-900 tracking-tight flex items-center">
                            <i class="fas fa-star text-amber-400 mr-2.5"></i>
                            Đánh Giá Của Tôi
                        </h1>
                        <p class="text-sm text-gray-500 mt-1">Quản lý và xem lại tất cả các đánh giá bạn đã viết cho Freelancer.</p>
                    </div>
                </div>
                <!-- Danh sách đánh giá -->
                <div id="reviewsList" class="space-y-4">
                    <p class="text-center text-gray-400 text-sm mt-10"><i class="fas fa-spinner fa-spin mr-2"></i>Đang tải dữ liệu...</p>
                </div>
            </div>
        </main>
    </div>

    <!-- Script -->
    <script src="ui.js"></script>
    <script>
        const API_URL = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' 
            ? 'http://localhost:5000' 
            : 'https://htwork-backend.onrender.com';

        let currentUser = null;

        async function loadMyReviews() {
            try {
                const userStr = localStorage.getItem('user');
                if (!userStr) {
                    window.location.href = '../index.html';
                    return;
                }
                currentUser = JSON.parse(userStr);

                const response = await fetch(`${API_URL}/api/reviews/client/${currentUser.id}`);
                const data = await response.json();
                const reviews = data.reviews || [];

                const reviewsList = document.getElementById('reviewsList');
                
                if (reviews.length === 0) {
                    reviewsList.innerHTML = `
                        <div class="bg-white rounded-3xl p-10 text-center shadow-sm border border-gray-100">
                            <div class="w-20 h-20 bg-gray-50 rounded-full flex items-center justify-center mx-auto mb-4">
                                <i class="fas fa-comment-slash text-3xl text-gray-300"></i>
                            </div>
                            <h3 class="text-lg font-bold text-gray-700 mb-2">Chưa có đánh giá nào</h3>
                            <p class="text-sm text-gray-500 max-w-sm mx-auto">Bạn chưa viết bất kỳ đánh giá nào cho Freelancer. Các đánh giá sẽ xuất hiện ở đây sau khi bạn nghiệm thu dự án.</p>
                        </div>
                    `;
                    return;
                }

                reviewsList.innerHTML = reviews.map(r => renderReviewCard(r)).join('');

            } catch (err) {
                console.error(err);
                document.getElementById('reviewsList').innerHTML = '<p class="text-center text-red-500 text-sm mt-10">Lỗi kết nối máy chủ.</p>';
            }
        }

        function renderReviewCard(review) {
            const starHtml = Array(5).fill(0).map((_, i) => `<i class="${i < review.rating ? 'fas' : 'far text-gray-300'} fa-star"></i>`).join('');
            const tagsHtml = review.tags && review.tags.length > 0 ? `
                <div class="flex flex-wrap gap-1.5 mt-3">
                    ${review.tags.map(t => `<span class="px-2.5 py-0.5 rounded text-[11px] font-semibold bg-gray-50 text-amber-800 border border-amber-200/50">${t}</span>`).join('')}
                </div>
            ` : '';
            const dateStr = new Date(review.created_at).toLocaleDateString('vi-VN', { year: 'numeric', month: 'long', day: 'numeric' });

            return `
                <div class="bg-white rounded-3xl p-5 md:p-6 shadow-sm border border-gray-100 transition hover:shadow-md">
                    <div class="flex flex-col md:flex-row justify-between items-start gap-4">
                        <div class="flex-1">
                            <div class="flex items-center justify-between mb-2">
                                <h3 class="font-bold text-gray-900 text-base flex items-center">
                                    <i class="fas fa-project-diagram text-indigo-400 mr-2 text-sm"></i> ${review.job_title}
                                </h3>
                                <span class="text-[11px] font-semibold text-gray-400"><i class="far fa-clock mr-1"></i> ${dateStr}</span>
                            </div>
                            
                            <div class="bg-gradient-to-r from-amber-50 to-orange-50 border border-amber-200/60 rounded-2xl p-4 mt-3">
                                <div class="flex items-center mb-2">
                                    <div class="flex text-amber-400 text-sm mr-2">${starHtml}</div>
                                    <span class="text-[10px] font-bold text-amber-800 bg-amber-200/50 px-2 py-0.5 rounded-md">${review.rating}/5</span>
                                </div>
                                <p class="text-sm text-gray-700 italic">"${review.comment}"</p>
                                ${tagsHtml}
                            </div>
                        </div>
                        
                        <div class="shrink-0 flex items-center justify-end w-full md:w-auto mt-2 md:mt-0">
                            <!-- Nút sửa liên kết đến review-work -->
                            <a href="review-work.html?edit_review=true&job_id=${review.job_id}" class="text-indigo-600 hover:text-indigo-800 text-xs font-bold flex items-center bg-indigo-50 hover:bg-indigo-100 px-4 py-2 rounded-xl transition">
                                <i class="fas fa-edit mr-1.5"></i> Sửa Đánh Giá
                            </a>
                        </div>
                    </div>
                </div>
            `;
        }

        window.addEventListener('DOMContentLoaded', loadMyReviews);
    </script>
</body>
</html>
