    <script>
        const API_URL = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' 
            ? 'http://localhost:5000' 
            : 'https://htwork-backend.onrender.com';
            
        const user = JSON.parse(localStorage.getItem('user'));
        if (!user || user.role !== 'client') {
            alert('Vui lÃ²ng Ä‘Äƒng nháº­p vá»›i tÆ° cÃ¡ch KhÃ¡ch hÃ ng!');
            window.location.href = '../sharedFolder/login.html';
        }

        // document.getElementById('logoutBtn').addEventListener('click', () => { 
            localStorage.clear(); 
            window.location.href = '../sharedFolder/login.html'; 
        });

        // Xá»­ lÃ½ Modal
        const editModal = document.getElementById('editModal');
        function openEditModal() { editModal.classList.remove('hidden'); }
        function closeEditModal() { editModal.classList.add('hidden'); }

        // Upload Helper
        async function uploadImageFile(file) {
            const formData = new FormData();
            formData.append('file', file);
            const res = await fetch(`${API_URL}/api/upload/image`, {
                method: 'POST',
                body: formData
            });
            
            let data;
            try {
                data = await res.json();
            } catch (err) {
                throw new Error('Server khÃ´ng pháº£n há»“i báº±ng JSON. CÃ³ thá»ƒ báº¡n chÆ°a Push code Backend lÃªn Render!');
            }

            if (!res.ok) {
                throw new Error(data.error || 'Lá»—i khÃ´ng xÃ¡c Ä‘á»‹nh tá»« server');
            }
            return data.url;
        }

        // Handle Avatar File Selection
        document.getElementById('avatarUpload').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const preview = document.getElementById('previewAvatar');
            const oldSrc = preview.src;
            preview.src = 'https://i.gifer.com/ZKZg.gif'; // Loading gif
            try {
                const url = await uploadImageFile(file);
                document.getElementById('avatar_url').value = url;
                preview.src = url;
                alert('âœ… Táº£i áº£nh Ä‘áº¡i diá»‡n lÃªn Cloudinary thÃ nh cÃ´ng!');
            } catch (err) { 
                preview.src = oldSrc;
                alert('âŒ Lá»—i táº£i áº£nh: ' + err.message); 
            }
        });

        // Handle Cover File Selection
        document.getElementById('coverUpload').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const preview = document.getElementById('previewCover');
            const oldSrc = preview.src;
            preview.src = 'https://i.gifer.com/ZKZg.gif'; // Loading gif
            try {
                const url = await uploadImageFile(file);
                document.getElementById('cover_url').value = url;
                preview.src = url;
                alert('âœ… Táº£i áº£nh bÃ¬a lÃªn Cloudinary thÃ nh cÃ´ng!');
            } catch (err) { 
                preview.src = oldSrc;
                alert('âŒ Lá»—i táº£i áº£nh bÃ¬a: ' + err.message); 
            }
        });

        // Render UI
        function renderUI(data) {
            const name = data.full_name || data.email;
            // document.getElementById('clientName').innerText = name;
            document.getElementById('displayName').innerText = name;
            
            if (data.avatar_url) {
                document.getElementById('avatarContainer').src = data.avatar_url;
                document.getElementById('previewAvatar').src = data.avatar_url;
                document.getElementById('avatar_url').value = data.avatar_url;
            }
            if (data.cover_url) {
                document.getElementById('coverContainer').style.backgroundImage = `url('${data.cover_url}')`;
                document.getElementById('previewCover').src = data.cover_url;
                document.getElementById('cover_url').value = data.cover_url;
            }
            
            document.getElementById('displayBio').innerText = data.bio || 'ChÆ°a cÃ³ thÃ´ng tin giá»›i thiá»‡u.';
            document.getElementById('full_name').value = data.full_name || '';
            document.getElementById('bio').value = data.bio || '';
            
            // NgÃ¢n hÃ ng
            document.getElementById('bank_name').value = data.bank_name || '';
            document.getElementById('bank_account').value = data.bank_account || '';
            document.getElementById('bank_owner').value = data.bank_owner || '';
        }

        // Load profile data
        async function loadProfile() {
            try {
                const res = await fetch(`${API_URL}/api/users/${user.id}`);
                
                let data;
                try {
                    data = await res.json();
                } catch(e) {
                    throw new Error('Lá»—i 404: Báº¡n CHÆ¯A PUSH code backend lÃªn Render! Vui lÃ²ng lÃ m BÆ°á»›c 2.');
                }

                if (!res.ok) {
                    if (data.error && data.error.includes('cover_url')) {
                        throw new Error('Lá»—i Database: Báº¡n CHÆ¯A CHáº Y Lá»†NH SQL táº¡o cá»™t cover_url trÃªn Supabase! Vui lÃ²ng lÃ m BÆ°á»›c 1.');
                    }
                    throw new Error(data.error || 'Lá»—i khÃ´ng táº£i Ä‘Æ°á»£c thÃ´ng tin');
                }

                renderUI(data);
            } catch (error) {
                console.error(error);
                alert(error.message);
            }
        }

        // Cáº­p nháº­t Profile
        document.getElementById('profileForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const submitBtn = document.querySelector('button[form="profileForm"]');
            const btnText = document.getElementById('saveBtnText');
            const spinner = document.getElementById('saveSpinner');
            
            if(submitBtn) submitBtn.disabled = true;
            btnText.innerText = 'Äang lÆ°u...';
            spinner.classList.remove('hidden');

            const payload = {
                full_name: document.getElementById('full_name').value,
                avatar_url: document.getElementById('avatar_url').value,
                cover_url: document.getElementById('cover_url').value,
                bio: document.getElementById('bio').value,
                bank_name: document.getElementById('bank_name').value,
                bank_account: document.getElementById('bank_account').value,
                bank_owner: document.getElementById('bank_owner').value,
                skills: ''
            };

            try {
                const res = await fetch(`${API_URL}/api/users/${user.id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                let data;
                try {
                    data = await res.json();
                } catch (err) {
                    throw new Error('Báº¡n chÆ°a Push (Ä‘áº©y) Backend lÃªn Render, hoáº·c API Server Ä‘ang bá»‹ lá»—i! Vui lÃ²ng Ä‘áº©y code Backend lÃªn.');
                }
                
                if (!res.ok) throw new Error(data.error || 'Cáº­p nháº­t tháº¥t báº¡i');

                // Cáº­p nháº­t localStorage
                const updatedUser = { ...user, full_name: data.user.full_name, avatar_url: data.user.avatar_url };
                localStorage.setItem('user', JSON.stringify(updatedUser));
                
                // ÄÃ³ng modal vÃ  render láº¡i
                renderUI(data.user);
                closeEditModal();
                alert('âœ… LÆ°u há»“ sÆ¡ thÃ nh cÃ´ng!');
                
            } catch (error) {
                alert('âŒ Lá»—i khÃ´ng thá»ƒ lÆ°u: ' + error.message);
            } finally {
                submitBtn.disabled = false;
                btnText.innerText = 'LÆ°u';
                spinner.classList.add('hidden');
            }
        });

        // Khá»Ÿi cháº¡y
        loadProfile();
    </script>
