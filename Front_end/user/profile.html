<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Hồ sơ của tôi - Khách hàng</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-blue-50 h-screen flex flex-col">
    <!-- Navbar -->
    <nav class="bg-blue-600 p-4 text-white flex justify-between shadow-md">
        <div class="font-bold flex items-center space-x-4">
            <a href="home.html" class="hover:text-blue-200">HT Work - Client Portal</a>
            <span class="text-blue-300">|</span>
            <a href="profile.html" class="font-semibold underline">Hồ sơ của tôi</a>
        </div>
        <div>
            <span id="clientName" class="mr-4 font-medium"></span>
            <button id="logoutBtn" class="bg-blue-800 px-3 py-1 rounded">Đăng xuất</button>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="p-10 max-w-4xl mx-auto w-full flex-grow">
        <div class="bg-white p-8 rounded-lg shadow-md border-t-4 border-blue-500">
            <h2 class="text-2xl font-bold text-gray-800 mb-6">Thông tin cá nhân (Profile)</h2>
            
            <form id="profileForm" class="space-y-6">
                <!-- Avatar -->
                <div>
                    <label class="block text-gray-700 font-medium mb-2">Đường dẫn Ảnh đại diện (Avatar URL)</label>
                    <input type="text" id="avatar_url" class="w-full border border-gray-300 rounded px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="https://example.com/avatar.jpg">
                </div>

                <!-- Full Name -->
                <div>
                    <label class="block text-gray-700 font-medium mb-2">Họ và tên / Tên công ty</label>
                    <input type="text" id="full_name" required class="w-full border border-gray-300 rounded px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>

                <!-- Bio -->
                <div>
                    <label class="block text-gray-700 font-medium mb-2">Giới thiệu ngắn (Bio)</label>
                    <textarea id="bio" rows="4" class="w-full border border-gray-300 rounded px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Giới thiệu về bạn hoặc doanh nghiệp của bạn..."></textarea>
                </div>

                <!-- Nút Submit -->
                <div class="flex justify-end">
                    <button type="submit" class="bg-blue-600 text-white px-6 py-2 rounded font-bold hover:bg-blue-700 transition">Lưu thay đổi</button>
                </div>
            </form>

            <div id="statusMessage" class="mt-4 hidden p-3 rounded"></div>
        </div>
    </main>

    <script>
        const API_URL = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' 
            ? 'http://localhost:5000' 
            : 'https://htwork-backend.onrender.com';
            
        const user = JSON.parse(localStorage.getItem('user'));
        if (!user || user.role !== 'client') {
            alert('Vui lòng đăng nhập với tư cách Khách hàng!');
            window.location.href = '../sharedFolder/login.html';
        }

        document.getElementById('clientName').innerText = `Xin chào, ${user.full_name || user.email}`;
        document.getElementById('logoutBtn').addEventListener('click', () => { 
            localStorage.clear(); 
            window.location.href = '../sharedFolder/login.html'; 
        });

        // Load profile data
        async function loadProfile() {
            try {
                const res = await fetch(`${API_URL}/api/users/${user.id}`);
                if (!res.ok) throw new Error('Không thể tải thông tin profile');
                const data = await res.json();
                
                document.getElementById('full_name').value = data.full_name || '';
                document.getElementById('avatar_url').value = data.avatar_url || '';
                document.getElementById('bio').value = data.bio || '';
            } catch (error) {
                console.error(error);
            }
        }

        // Cập nhật Profile
        document.getElementById('profileForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const submitBtn = e.target.querySelector('button');
            const statusMessage = document.getElementById('statusMessage');
            
            submitBtn.disabled = true;
            submitBtn.innerText = 'Đang lưu...';
            statusMessage.classList.add('hidden');

            const payload = {
                full_name: document.getElementById('full_name').value,
                avatar_url: document.getElementById('avatar_url').value,
                bio: document.getElementById('bio').value,
                skills: '' // Khách hàng không cần nhập skills
            };

            try {
                const res = await fetch(`${API_URL}/api/users/${user.id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || 'Cập nhật thất bại');

                // Cập nhật lại localStorage để Tên hiển thị trên Nav thay đổi ngay lập tức
                const updatedUser = { ...user, full_name: data.user.full_name, avatar_url: data.user.avatar_url };
                localStorage.setItem('user', JSON.stringify(updatedUser));
                document.getElementById('clientName').innerText = `Xin chào, ${updatedUser.full_name}`;

                statusMessage.innerText = 'Cập nhật hồ sơ thành công!';
                statusMessage.className = 'mt-4 p-3 rounded bg-green-100 text-green-700 border border-green-200 block';
            } catch (error) {
                statusMessage.innerText = error.message;
                statusMessage.className = 'mt-4 p-3 rounded bg-red-100 text-red-700 border border-red-200 block';
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = 'Lưu thay đổi';
            }
        });

        // Khởi chạy
        loadProfile();
    </script>
</body>
</html>
