<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chợ Việc Làm - Freelancer</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 p-10">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-3xl font-bold text-gray-800 mb-6">Chợ Việc Làm (Freelancer)</h1>
        
        <button onclick="loadJobs()" class="mb-4 bg-green-600 text-white py-2 px-4 rounded hover:bg-green-700">Tải lại danh sách</button>
        
        <div id="jobList" class="space-y-4">
            <!-- Jobs sẽ được render vào đây -->
            <p class="text-gray-500">Đang tải danh sách công việc...</p>
        </div>
    </div>

    <!-- Modal Ứng tuyển -->
    <div id="applyModal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center">
        <div class="bg-white p-6 rounded-lg w-96 shadow-xl">
            <h2 class="text-xl font-bold mb-4">Ứng Tuyển Dự Án</h2>
            <form id="applyForm" class="space-y-4">
                <input type="hidden" id="modal_job_id">
                <input type="hidden" id="modal_job_budget">
                
                <div>
                    <label class="block text-sm font-medium">Lời giới thiệu (Cover Letter):</label>
                    <textarea id="cover_letter" required class="mt-1 block w-full border p-2 rounded"></textarea>
                </div>
                <div>
                    <label class="block text-sm font-medium">Giá nhận làm (Bid Amount):</label>
                    <input type="number" id="bid_amount" required class="mt-1 block w-full border p-2 rounded">
                </div>
                <div class="flex justify-end space-x-2">
                    <button type="button" onclick="closeModal()" class="bg-gray-300 px-4 py-2 rounded">Hủy</button>
                    <button type="submit" id="btnSubmitApplication" class="bg-blue-600 text-white px-4 py-2 rounded">Gửi Ứng Tuyển</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const API_URL = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' 
            ? 'http://localhost:5000' 
            : 'https://htwork-backend.onrender.com';

        let currentUser = null;
        const userStr = localStorage.getItem('user');
        if (userStr) {
            currentUser = JSON.parse(userStr);
        } else {
            alert('Bạn chưa đăng nhập!');
            window.location.replace('../sharedFolder/login.html');
        }

        async function loadJobs() {
            const listDiv = document.getElementById('jobList');
            listDiv.innerHTML = '<p class="text-gray-500">Đang tải...</p>';
            try {
                const response = await fetch(`${API_URL}/api/jobs`);
                const data = await response.json();
                
                if (data.jobs && data.jobs.length > 0) {
                    listDiv.innerHTML = data.jobs.map(job => `
                        <div class="bg-white p-4 rounded-lg shadow border border-gray-200">
                            <h3 class="text-xl font-bold text-blue-600">${job.title}</h3>
                            <p class="text-sm text-gray-500 mb-2">Đăng bởi Client: ${job.users ? job.users.full_name : 'Ẩn danh'}</p>
                            <p class="text-gray-700 mb-4">${job.description}</p>
                            <div class="flex justify-between items-center">
                                <span class="font-bold text-green-600">Ngân sách: ${job.budget} Token</span>
                                <button onclick="openModal('${job.id}', ${job.budget})" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 shadow-sm">Ứng Tuyển Ngay</button>
                            </div>
                        </div>
                    `).join('');
                } else {
                    listDiv.innerHTML = '<p class="text-gray-500">Hiện chưa có dự án nào.</p>';
                }
            } catch (err) {
                listDiv.innerHTML = '<p class="text-red-500">Lỗi kết nối Server!</p>';
            }
        }

        // Logic mở đóng Modal
        function openModal(jobId, jobBudget) {
            document.getElementById('modal_job_id').value = jobId;
            document.getElementById('modal_job_budget').value = jobBudget; // Store budget for validation
            document.getElementById('applyModal').classList.remove('hidden');
        }
        function closeModal() {
            document.getElementById('applyModal').classList.add('hidden');
        }

        // Logic Submit Ứng tuyển
        document.getElementById('applyForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const jobId = document.getElementById('modal_job_id').value;
            const jobBudget = parseFloat(document.getElementById('modal_job_budget').value);
            const bidAmount = parseFloat(document.getElementById('bid_amount').value);
            const coverLetter = document.getElementById('cover_letter').value;
            const btnSubmit = document.getElementById('btnSubmitApplication');

            if (!bidAmount || bidAmount <= 0) {
                alert('Giá nhận làm phải lớn hơn 0');
                return;
            }

            if (bidAmount > jobBudget) {
                alert('Giá nhận làm không được vượt quá Ngân sách dự kiến của Khách hàng (' + jobBudget + ' Token). Vui lòng nhập mức giá phù hợp.');
                return;
            }

            // Vô hiệu hóa nút để tránh spam click 2 lần
            btnSubmit.disabled = true;
            btnSubmit.innerHTML = 'Đang xử lý...';
            btnSubmit.classList.add('opacity-50', 'cursor-not-allowed');

            const payload = {
                job_id: jobId,
                freelancer_id: currentUser.id,
                bid_amount: bidAmount,
                cover_letter: coverLetter
            };

            try {
                const response = await fetch(`${API_URL}/api/jobs/apply`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                const data = await response.json();
                if (response.ok) {
                    alert('Ứng tuyển thành công!');
                    closeModal();
                    loadJobs(); // Tải lại danh sách
                } else {
                    alert('Lỗi: ' + data.error);
                }
            } catch (err) {
                alert('Không thể kết nối đến Backend');
            } finally {
                // Phục hồi lại nút
                btnSubmit.disabled = false;
                btnSubmit.innerHTML = 'Gửi Ứng Tuyển';
                btnSubmit.classList.remove('opacity-50', 'cursor-not-allowed');
            }
        });

        // Load lần đầu
        loadJobs();
    </script>
</body>
</html>
