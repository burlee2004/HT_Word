<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yêu Cầu Của Tôi - HT Work</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 p-10">
    <div class="max-w-4xl mx-auto">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-3xl font-bold text-gray-800">Danh Sách Yêu Cầu (Job) Đã Đăng</h1>
            <a href="home.html" class="text-blue-600 hover:underline">← Quay lại Trang Chủ</a>
        </div>
        
        <div id="requestsList" class="space-y-6">
            <p class="text-gray-500">Đang tải dữ liệu...</p>
        </div>
    </div>

    <script>
        const API_URL = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' 
            ? 'http://localhost:5000' 
            : 'https://htwork-backend.onrender.com';

        let currentUser = null;

        async function loadMyRequests() {
            const userStr = localStorage.getItem('user');
            if (!userStr) {
                alert('Bạn chưa đăng nhập!');
                window.location.replace('../sharedFolder/login.html');
                return;
            }
            currentUser = JSON.parse(userStr);

            const listDiv = document.getElementById('requestsList');
            try {
                const response = await fetch(`${API_URL}/api/client/${currentUser.id}/my-jobs`);
                const data = await response.json();
                
                if (response.ok && data.jobs && data.jobs.length > 0) {
                    listDiv.innerHTML = data.jobs.map(job => `
                        <div class="bg-white p-6 rounded-lg shadow-md border-l-4 border-purple-500 transition hover:shadow-lg">
                            <div class="flex justify-between items-start">
                                <div>
                                    <h2 class="text-xl font-bold text-gray-800">${job.title}</h2>
                                    <div class="text-sm text-gray-400 mt-1">Đăng ngày: ${new Date(job.created_at).toLocaleDateString('vi-VN')}</div>
                                </div>
                                <span class="px-3 py-1 bg-gray-100 text-gray-800 rounded-full text-sm font-semibold border ${job.status === 'open' ? 'border-green-500 text-green-700 bg-green-50' : 'border-gray-300'}">${job.status.toUpperCase()}</span>
                            </div>
                            
                            <!-- Phần chi tiết (Mặc định ẩn) -->
                            <div id="details-${job.id}" class="hidden mt-4 pt-4 border-t border-gray-100">
                                <p class="text-gray-700 whitespace-pre-wrap"><strong>Mô tả chi tiết:</strong><br>${job.description}</p>
                                <p class="text-gray-700 mt-2"><strong>Ngân sách dự kiến:</strong> <span class="font-bold text-green-600">${job.budget} Token</span></p>
                            </div>

                            <div class="mt-4 flex space-x-3">
                                <button onclick="toggleDetails('${job.id}')" class="text-purple-600 font-semibold hover:text-purple-800 focus:outline-none">
                                    <span id="btn-text-${job.id}">Xem chi tiết ▼</span>
                                </button>
                            </div>
                        </div>
                    `).join('');
                } else {
                    listDiv.innerHTML = '<div class="bg-white p-6 rounded shadow text-center"><p class="text-gray-500">Bạn chưa đăng bất kỳ yêu cầu nào.</p><a href="post-job.html" class="mt-4 inline-block bg-green-500 text-white px-4 py-2 rounded">Đăng yêu cầu đầu tiên</a></div>';
                }
            } catch (err) {
                listDiv.innerHTML = '<p class="text-red-500">Lỗi kết nối Server!</p>';
            }
        }

        function toggleDetails(jobId) {
            const detailsDiv = document.getElementById(`details-${jobId}`);
            const btnText = document.getElementById(`btn-text-${jobId}`);
            
            if (detailsDiv.classList.contains('hidden')) {
                detailsDiv.classList.remove('hidden');
                btnText.textContent = 'Thu gọn ▲';
            } else {
                detailsDiv.classList.add('hidden');
                btnText.textContent = 'Xem chi tiết ▼';
            }
        }

        loadMyRequests();
    </script>
</body>
</html>
