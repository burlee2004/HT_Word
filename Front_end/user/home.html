<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Client Portal - HT Work</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-blue-50 h-screen flex flex-col">
    <nav class="bg-blue-600 p-4 text-white flex justify-between shadow-md">
        <div class="font-bold">HT Work - Client Portal</div>
        <div>
            <span id="clientName" class="mr-4 font-medium"></span>
            <button id="logoutBtn" class="bg-blue-800 px-3 py-1 rounded">Đăng xuất</button>
        </div>
    </nav>
    <main class="p-10">
        <div class="bg-white p-6 rounded-lg shadow border-l-4 border-blue-500">
            <h2 class="text-2xl font-bold text-gray-800">Dự án của tôi</h2>
            <button class="mt-4 bg-green-500 text-white px-4 py-2 rounded hover:bg-green-600">+ Đăng tải yêu cầu mới</button>
        </div>
    </main>
    <script>
        const user = JSON.parse(localStorage.getItem('user'));
        if (!user || user.role !== 'client') { window.location.href = '../sharedFolder/login.html'; }
        document.getElementById('clientName').textContent = user.full_name;
        document.getElementById('logoutBtn').addEventListener('click', () => { localStorage.clear(); window.location.href = '../sharedFolder/login.html'; });
    </script>
</body>
</html>
