<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khách hàng - Quản Lý & Nghiệm thu</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 p-10">
    <div class="max-w-5xl mx-auto">
        <h1 class="text-3xl font-bold text-gray-800 mb-6">Quản Lý Tiến Độ & Nghiệm Thu</h1>
        <p class="text-gray-600 mb-8">Nơi bạn duyệt Kế hoạch (Khóa Escrow) và Nghiệm thu các mốc công việc (Giải ngân).</p>
        
        <div id="jobsList" class="space-y-6">
            <p class="text-gray-500">Đang tải...</p>
        </div>
    </div>

    <!-- Modal Yêu cầu sửa đổi (Revision) -->
    <div id="revisionModal" class="fixed inset-0 bg-gray-600 bg-opacity-50 hidden flex justify-center items-center">
        <div class="bg-white p-6 rounded-lg shadow-lg w-[500px]">
            <h2 class="text-2xl font-bold mb-4 text-red-600">Yêu Cầu Chỉnh Sửa</h2>
            <p class="text-gray-600 mb-4 text-sm">Vui lòng mô tả rõ lỗi để Freelancer sửa lại cho chuẩn.</p>
            
            <input type="hidden" id="rev_milestone_id">
            
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium">Nội dung yêu cầu sửa:</label>
                    <textarea id="rev_feedback" rows="3" class="mt-1 block w-full border p-2 rounded text-sm" placeholder="Màu nút bấm bị sai, tính năng login bị lỗi..."></textarea>
                </div>
                <div>
                    <label class="block text-sm font-medium">Link ảnh chụp lỗi (Nếu có):</label>
                    <input type="text" id="rev_screenshot" class="mt-1 block w-full border p-2 rounded text-sm" placeholder="https://...">
                </div>
            </div>

            <div class="mt-6 flex justify-end space-x-2 border-t pt-4">
                <button type="button" onclick="closeRevisionModal()" class="bg-gray-300 px-4 py-2 rounded hover:bg-gray-400 font-bold">Hủy</button>
                <button type="button" onclick="submitRevision()" class="bg-red-600 text-white px-4 py-2 rounded font-bold hover:bg-red-700">Gửi Yêu Cầu</button>
            </div>
        </div>
    </div>

    <!-- Modal Chat & Upload -->
    <div id="chatModal" class="fixed inset-0 bg-gray-600 bg-opacity-75 hidden flex justify-center items-center z-50">
        <div class="bg-white rounded-lg shadow-xl w-full max-w-2xl flex flex-col" style="height: 80vh;">
            <div class="flex justify-between items-center p-4 border-b bg-gray-50 rounded-t-lg">
                <h2 class="text-lg font-bold text-gray-800">Phòng Thảo Luận Dự Án</h2>
                <button onclick="closeChatModal()" class="text-gray-500 hover:text-red-500 text-2xl font-bold">&times;</button>
            </div>
            
            <div id="chatMessages" class="flex-1 p-4 overflow-y-auto bg-gray-100 space-y-4">
                <!-- Tin nhắn sẽ hiển thị ở đây -->
            </div>
            
            <div class="p-4 border-t bg-white rounded-b-lg">
                <input type="hidden" id="chat_job_id">
                <div class="flex flex-col space-y-2">
                    <textarea id="chatInput" rows="2" class="w-full border p-2 rounded text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Nhập nội dung tin nhắn..."></textarea>
                    
                    <div class="flex justify-between items-center">
                        <div class="flex items-center space-x-2">
                            <input type="file" id="chatFile" class="text-sm border p-1 rounded">
                            <span class="text-xs text-gray-500">(Ảnh/Video/File)</span>
                        </div>
                        <button onclick="sendChatMessage()" id="btnSendChat" class="bg-blue-600 text-white px-6 py-2 rounded font-bold hover:bg-blue-700 shadow flex items-center justify-center">
                            Gửi
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' 
            ? 'http://localhost:5000' 
            : 'https://htwork-backend.onrender.com';

        let currentUser = null;

        async function loadPendingActions() {
            const userStr = localStorage.getItem('user');
            if (!userStr) {
                alert('Bạn chưa đăng nhập!');
                window.location.replace('../sharedFolder/login.html');
                return;
            }
            currentUser = JSON.parse(userStr);

            const listDiv = document.getElementById('jobsList');
            try {
                const response = await fetch(`${API_URL}/api/client/${currentUser.id}/pending-actions`);
                const data = await response.json();
                
                if (data.jobs && data.jobs.length > 0) {
                    listDiv.innerHTML = data.jobs.map(job => renderJob(job)).join('');
                } else {
                    listDiv.innerHTML = '<p class="text-gray-500 bg-white p-6 rounded shadow">Hiện không có công việc nào cần bạn xử lý.</p>';
                }
            } catch (err) {
                listDiv.innerHTML = '<p class="text-red-500">Lỗi kết nối Server!</p>';
            }
        }

        function renderJob(job) {
            let actionHtml = '';

            if (job.status === 'pending_plan_approval') {
                const totalAmount = job.milestones.reduce((sum, m) => sum + parseFloat(m.amount), 0);
                actionHtml = `
                    <div class="bg-yellow-50 p-4 border border-yellow-300 rounded mt-4">
                        <h3 class="font-bold text-yellow-800 text-lg mb-2">Freelancer đã gửi Bản Kế Hoạch!</h3>
                        <p class="text-sm text-gray-700 mb-4">Vui lòng xem kỹ các mốc công việc bên dưới. Nếu đồng ý, hệ thống sẽ <strong>Khóa (Escrow) tổng cộng ${totalAmount} Token</strong> từ ví của bạn.</p>
                        
                        <div class="space-y-3 mb-4">
                            ${job.milestones.map((m, i) => `
                                <div class="bg-white p-3 rounded shadow-sm border border-gray-100 text-sm">
                                    <div class="flex justify-between font-bold"><span>Mốc ${i+1}: ${m.title}</span> <span class="text-green-600">${m.amount} Token</span></div>
                                    <div class="text-gray-600 mt-1">Bàn giao: ${m.expected_deliverables} | Thanh toán: ${m.payment_mode}</div>
                                </div>
                            `).join('')}
                        </div>
                        
                        <button onclick="approvePlanAndLock('${job.id}')" class="bg-yellow-600 text-white font-bold px-6 py-2 rounded hover:bg-yellow-700 shadow">Đồng ý Kế Hoạch & Khóa Escrow</button>
                    </div>
                `;
            } else if (job.status === 'in_progress') {
                const pendingMilestones = job.milestones.filter(m => m.status === 'PENDING_REVIEW');
                if (pendingMilestones.length > 0) {
                    actionHtml = `
                        <div class="mt-4 space-y-4">
                            <h3 class="font-bold text-gray-800">Cần Nghiệm Thu:</h3>
                            ${pendingMilestones.map(m => `
                                <div class="bg-blue-50 p-4 rounded border border-blue-200">
                                    <h4 class="font-bold text-blue-800 text-lg">${m.title}</h4>
                                    <p class="text-sm text-gray-700 mt-1"><strong>Freelancer nộp bài:</strong> <a href="${m.proof_urls ? m.proof_urls[0] : m.evidence_url}" target="_blank" class="text-blue-600 underline">Xem minh chứng</a></p>
                                    <p class="text-sm text-gray-700 mt-1"><strong>Số tiền giải ngân:</strong> <span class="text-green-600 font-bold">${m.amount} Token</span></p>
                                    
                                    <div class="mt-4 flex space-x-3">
                                        <button onclick="approveMilestone('${m.id}')" class="bg-green-600 text-white px-4 py-2 rounded font-bold hover:bg-green-700 shadow">✅ Nghiệm Thu (Approve)</button>
                                        <button onclick="openRevisionModal('${m.id}')" class="bg-red-100 text-red-600 px-4 py-2 rounded font-bold border border-red-300 hover:bg-red-200">❌ Bắt sửa lại (Revision)</button>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    `;
                } else {
                    actionHtml = `<div class="mt-4 p-4 bg-gray-100 rounded text-gray-500">Dự án đang chạy. Đang chờ Freelancer nộp bài cho các mốc tiếp theo...</div>`;
                }
            }

            return `
                <div class="bg-white p-6 rounded-lg shadow-md border-l-4 border-indigo-500">
                    <div class="flex justify-between items-center">
                        <h2 class="text-2xl font-bold text-gray-800">${job.title}</h2>
                        <button onclick="openChatModal('${job.id}')" class="bg-blue-100 text-blue-700 hover:bg-blue-200 px-3 py-1 rounded text-sm font-bold shadow-sm flex items-center">💬 Thảo luận</button>
                    </div>
                    ${actionHtml}
                </div>
            `;
        }

        // --- Hành động: Khóa Escrow
        async function approvePlanAndLock(jobId) {
            if (!confirm('Bạn có chắc chắn chốt kế hoạch này? Tiền sẽ bị Khóa Escrow.')) return;
            try {
                const response = await fetch(`${API_URL}/api/jobs/start-project`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ client_id: currentUser.id, job_id: jobId })
                });
                const data = await response.json();
                if (response.ok) {
                    alert('Thành công: ' + data.message);
                    loadPendingActions();
                } else {
                    alert('Lỗi: ' + data.error);
                }
            } catch (err) {
                alert('Không thể kết nối đến Backend');
            }
        }

        // --- Hành động: Nghiệm thu (Giải ngân ACID)
        async function approveMilestone(milestoneId) {
            if (!confirm('Xác nhận Nghiệm thu mốc công việc này? (Tiền sẽ được xử lý tự động)')) return;
            try {
                const response = await fetch(`${API_URL}/api/milestones/advanced/approve`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ client_id: currentUser.id, milestone_id: milestoneId })
                });
                const data = await response.json();
                if (response.ok) {
                    alert('Nghiệm thu thành công: ' + data.message);
                    loadPendingActions();
                } else {
                    alert('Lỗi: ' + data.error);
                }
            } catch (err) {
                alert('Không thể kết nối đến Backend');
            }
        }

        // --- Hành động: Yêu cầu sửa (Revision)
        function openRevisionModal(milestoneId) {
            document.getElementById('rev_milestone_id').value = milestoneId;
            document.getElementById('rev_feedback').value = '';
            document.getElementById('rev_screenshot').value = '';
            document.getElementById('revisionModal').classList.remove('hidden');
        }

        function closeRevisionModal() {
            document.getElementById('revisionModal').classList.add('hidden');
        }

        async function submitRevision() {
            const mId = document.getElementById('rev_milestone_id').value;
            const feedback = document.getElementById('rev_feedback').value;
            const screenshot = document.getElementById('rev_screenshot').value;

            if (!feedback) { alert('Vui lòng nhập nội dung cần sửa!'); return; }

            const payload = {
                milestone_id: mId,
                feedback_text: feedback,
                screenshot_urls: screenshot ? [screenshot] : []
            };

            try {
                const response = await fetch(`${API_URL}/api/milestones/advanced/revision`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await response.json();
                if (response.ok) {
                    alert('Thành công: ' + data.message);
                    closeRevisionModal();
                    loadPendingActions();
                } else {
                    alert('Lỗi: ' + data.error);
                }
            } catch (err) {
                alert('Không thể kết nối Backend');
            }
        }

        // ---------- CHAT LOGIC ----------
        async function openChatModal(jobId) {
            document.getElementById('chat_job_id').value = jobId;
            document.getElementById('chatModal').classList.remove('hidden');
            loadChatMessages(jobId);
        }

        function closeChatModal() {
            document.getElementById('chatModal').classList.add('hidden');
        }

        async function loadChatMessages(jobId) {
            const chatBox = document.getElementById('chatMessages');
            chatBox.innerHTML = '<p class="text-center text-gray-500 mt-4">Đang tải tin nhắn...</p>';
            
            try {
                const res = await fetch(`${API_URL}/api/jobs/${jobId}/messages`);
                const data = await res.json();
                if (res.ok) {
                    if (data.messages.length === 0) {
                        chatBox.innerHTML = '<p class="text-center text-gray-500 mt-4">Chưa có tin nhắn nào. Bắt đầu thảo luận!</p>';
                    } else {
                        chatBox.innerHTML = data.messages.map(msg => renderMessage(msg)).join('');
                        chatBox.scrollTop = chatBox.scrollHeight;
                    }
                }
            } catch (err) {
                chatBox.innerHTML = '<p class="text-center text-red-500 mt-4">Lỗi kết nối Server!</p>';
            }
        }

        function renderMessage(msg) {
            const isMe = msg.sender_id === currentUser.id;
            const timeStr = new Date(msg.created_at).toLocaleTimeString('vi-VN', {hour: '2-digit', minute:'2-digit'});
            const roleBadge = msg.users.role === 'client' ? '<span class="text-[10px] bg-blue-100 text-blue-800 px-1 rounded ml-1">KHÁCH HÀNG</span>' : '<span class="text-[10px] bg-green-100 text-green-800 px-1 rounded ml-1">FREELANCER</span>';
            
            let fileHtml = '';
            if (msg.file_url) {
                if (msg.file_type === 'image') {
                    fileHtml = `<div class="mt-2"><img src="${msg.file_url}" class="max-w-[200px] rounded-lg border border-gray-200 cursor-pointer" onclick="window.open('${msg.file_url}', '_blank')"></div>`;
                } else if (msg.file_type === 'video') {
                    fileHtml = `<div class="mt-2"><video src="${msg.file_url}" controls class="max-w-[250px] rounded-lg"></video></div>`;
                } else {
                    fileHtml = `<div class="mt-2"><a href="${msg.file_url}" target="_blank" class="flex items-center text-sm underline ${isMe ? 'text-white' : 'text-blue-600'}">📁 Tải File đính kèm</a></div>`;
                }
            }

            return `
                <div class="flex flex-col ${isMe ? 'items-end' : 'items-start'}">
                    <div class="text-xs text-gray-500 mb-1 flex items-center">${msg.users.full_name} ${roleBadge} - ${timeStr}</div>
                    <div class="max-w-[80%] rounded-lg p-3 ${isMe ? 'bg-blue-600 text-white rounded-tr-none' : 'bg-white text-gray-800 rounded-tl-none border shadow-sm'}">
                        ${msg.content ? `<p class="text-sm whitespace-pre-wrap">${msg.content}</p>` : ''}
                        ${fileHtml}
                    </div>
                </div>
            `;
        }

        async function sendChatMessage() {
            const jobId = document.getElementById('chat_job_id').value;
            const content = document.getElementById('chatInput').value.trim();
            const fileInput = document.getElementById('chatFile');
            const btn = document.getElementById('btnSendChat');

            if (!content && (!fileInput.files || fileInput.files.length === 0)) return;

            btn.disabled = true;
            btn.textContent = '...';

            let fileUrl = null;
            let fileType = null;

            try {
                if (fileInput.files && fileInput.files.length > 0) {
                    const file = fileInput.files[0];
                    const formData = new FormData();
                    formData.append('file', file);
                    
                    const isImage = file.type.startsWith('image/');
                    const uploadEndpoint = isImage ? '/api/upload/image' : '/api/upload/file';

                    const uploadRes = await fetch(`${API_URL}${uploadEndpoint}`, {
                        method: 'POST',
                        body: formData
                    });
                    
                    if (!uploadRes.ok) throw new Error('Upload file thất bại');
                    const uploadData = await uploadRes.json();
                    fileUrl = uploadData.url;
                    fileType = uploadData.type;
                }

                const res = await fetch(`${API_URL}/api/jobs/${jobId}/messages`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        sender_id: currentUser.id,
                        content: content,
                        file_url: fileUrl,
                        file_type: fileType
                    })
                });

                if (res.ok) {
                    document.getElementById('chatInput').value = '';
                    document.getElementById('chatFile').value = '';
                    loadChatMessages(jobId);
                } else {
                    const data = await res.json();
                    alert('Lỗi gửi tin: ' + data.error);
                }
            } catch (err) {
                alert('Lỗi: ' + err.message);
            } finally {
                btn.disabled = false;
                btn.textContent = 'Gửi';
            }
        }

        loadPendingActions();
    </script>
</body>
</html>
