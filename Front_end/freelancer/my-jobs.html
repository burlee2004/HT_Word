<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Công việc của tôi - HT Work</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 p-10">
    <div class="max-w-5xl mx-auto">
        <h1 class="text-3xl font-bold text-gray-800 mb-6">Dự án Đang thực hiện</h1>
        
        <div id="jobsList" class="space-y-6">
            <p class="text-gray-500">Đang tải...</p>
        </div>
    </div>

    <!-- Modal Tạo Kế Hoạch (Milestone Builder) -->
    <div id="planModal" class="fixed inset-0 bg-gray-600 bg-opacity-50 hidden flex justify-center items-center">
        <div class="bg-white p-6 rounded-lg shadow-lg max-w-3xl w-full max-h-[90vh] overflow-y-auto">
            <h2 class="text-2xl font-bold mb-4">Lập Kế Hoạch Dự Án (Milestones)</h2>
            <p class="text-gray-600 mb-4">Chia nhỏ dự án thành các giai đoạn để dễ quản lý và nghiệm thu.</p>
            
            <input type="hidden" id="modal_job_id">
            
            <div id="milestonesContainer" class="space-y-4">
                <!-- Các form nhập milestone sẽ chèn vào đây -->
            </div>
            
            <button type="button" onclick="addMilestoneForm()" class="mt-4 bg-gray-200 text-gray-800 px-4 py-2 rounded hover:bg-gray-300 font-bold">+ Thêm Giai Đoạn Mới</button>

            <div class="mt-8 flex justify-end space-x-2 border-t pt-4">
                <button type="button" onclick="closePlanModal()" class="bg-red-100 text-red-600 px-4 py-2 rounded font-bold hover:bg-red-200">Hủy</button>
                <button type="button" onclick="submitPlan()" class="bg-green-600 text-white px-4 py-2 rounded font-bold hover:bg-green-700">Gửi Kế Hoạch Cho Khách Duyệt</button>
            </div>
        </div>
    </div>

    <!-- Modal Chat & Upload -->
    <div id="chatModal" class="fixed inset-0 bg-gray-600 bg-opacity-75 hidden flex justify-center items-center z-50">
        <div class="bg-white rounded-lg shadow-xl w-full max-w-2xl flex flex-col" style="height: 80vh;">
            <div class="flex justify-between items-center p-4 border-b bg-gray-50 rounded-t-lg">
                <h2 class="text-lg font-bold text-gray-800">Phòng Thảo Luận Dự Án</h2>
                <button onclick="closeChatModal()" class="text-gray-500 hover:text-red-500 text-2xl font-bold">&times;</button>
            </div>
            
            <div id="chatMessages" class="flex-1 p-4 overflow-y-auto bg-gray-100 space-y-4">
                <!-- Tin nhắn sẽ hiển thị ở đây -->
            </div>
            
            <div class="p-4 border-t bg-white rounded-b-lg">
                <input type="hidden" id="chat_job_id">
                <div class="flex flex-col space-y-2">
                    <textarea id="chatInput" rows="2" class="w-full border p-2 rounded text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Nhập nội dung tin nhắn..."></textarea>
                    
                    <div class="flex justify-between items-center">
                        <div class="flex items-center space-x-2">
                            <input type="file" id="chatFile" class="text-sm border p-1 rounded" multiple>
                            <span class="text-xs text-gray-500">(Ảnh/Video/File)</span>
                        </div>
                        <button onclick="sendChatMessage()" id="btnSendChat" class="bg-blue-600 text-white px-6 py-2 rounded font-bold hover:bg-blue-700 shadow flex items-center justify-center">
                            Gửi
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' 
            ? 'http://localhost:5000' 
            : 'https://htwork-backend.onrender.com';

        let currentUser = null;

        async function loadJobs() {
            const userStr = localStorage.getItem('user');
            if (!userStr) {
                alert('Bạn chưa đăng nhập!');
                window.location.replace('../sharedFolder/login.html');
                return;
            }
            currentUser = JSON.parse(userStr);

            const listDiv = document.getElementById('jobsList');
            try {
                const response = await fetch(`${API_URL}/api/freelancer/${currentUser.id}/active-jobs`);
                const data = await response.json();
                
                if (data.jobs && data.jobs.length > 0) {
                    listDiv.innerHTML = data.jobs.map(job => renderJob(job)).join('');
                } else {
                    listDiv.innerHTML = '<p class="text-gray-500 bg-white p-6 rounded shadow">Bạn chưa có dự án nào đang chạy.</p>';
                }
            } catch (err) {
                listDiv.innerHTML = '<p class="text-red-500">Lỗi kết nối Server!</p>';
            }
        }

        function renderJob(job) {
            let headerBadge = '';
            let contentHtml = '';

            if (job.status === 'planning') {
                headerBadge = '<span class="bg-blue-100 text-blue-800 text-sm font-semibold mr-2 px-2.5 py-0.5 rounded">Đang lập kế hoạch</span>';
                contentHtml = `
                    <div class="bg-blue-50 p-4 rounded border border-blue-200 mt-4">
                        <p class="text-blue-800">Khách hàng đã chọn bạn! Vui lòng lập kế hoạch (Milestones) để bắt đầu.</p>
                        <button onclick="openPlanModal('${job.id}')" class="mt-2 bg-blue-600 text-white px-4 py-2 rounded font-bold hover:bg-blue-700 shadow">Lập Kế Hoạch (Milestone Builder)</button>
                    </div>
                `;
            } else if (job.status === 'pending_plan_approval') {
                headerBadge = '<span class="bg-yellow-100 text-yellow-800 text-sm font-semibold mr-2 px-2.5 py-0.5 rounded">Chờ khách duyệt Plan</span>';
                contentHtml = '<p class="mt-4 text-gray-500 italic">Kế hoạch đã được gửi. Chờ khách hàng duyệt và khóa Escrow...</p>';
            } else if (job.status === 'in_progress') {
                headerBadge = '<span class="bg-green-100 text-green-800 text-sm font-semibold mr-2 px-2.5 py-0.5 rounded">Đang thực hiện (Escrow Locked)</span>';
                contentHtml = `
                    <div class="mt-4">
                        <h3 class="font-bold text-gray-800 border-b pb-2">Các Giai Đoạn (Milestones)</h3>
                        <ul class="mt-2 space-y-4">
                            ${job.milestones.map(m => renderMilestone(m)).join('')}
                        </ul>
                    </div>
                `;
            }

            return `
                <div class="bg-white p-6 rounded-lg shadow-md border-t-4 border-indigo-500">
                    <div class="flex justify-between items-center">
                        <h2 class="text-xl font-bold text-indigo-700">${job.title}</h2>
                        <div class="flex items-center space-x-2">
                            <button onclick="openChatModal('${job.id}', '${job.client_id}')" class="bg-blue-100 text-blue-700 hover:bg-blue-200 px-3 py-1 rounded text-sm font-bold shadow-sm flex items-center">💬 Thảo luận</button>
                            ${headerBadge}
                        </div>
                    </div>
                    <p class="text-gray-600 mt-2">${job.description}</p>
                    <p class="text-gray-800 mt-2 font-bold">Ngân sách dự kiến: ${job.budget} Token</p>
                    ${contentHtml}
                </div>
            `;
        }

        function renderMilestone(m) {
            let statusHtml = '';
            let actionHtml = '';

            if (m.status === 'PENDING' || m.status === 'IN_PROGRESS' || m.status === 'REVISION') {
                statusHtml = m.status === 'REVISION' 
                    ? '<span class="text-red-600 font-bold">Yêu cầu sửa (Revision)</span>' 
                    : '<span class="text-yellow-600 font-bold">Đang làm</span>';
                
                let revisionInfo = '';
                if (m.status === 'REVISION' && m.milestone_revisions && m.milestone_revisions.length > 0) {
                    const lastRev = m.milestone_revisions[m.milestone_revisions.length - 1];
                    revisionInfo = `
                        <div class="bg-red-50 p-3 rounded mt-2 border border-red-200">
                            <p class="text-red-800 text-sm"><strong>Khách hàng phản hồi:</strong> ${lastRev.feedback_text}</p>
                            ${lastRev.screenshot_urls && lastRev.screenshot_urls.length > 0 ? `<a href="${lastRev.screenshot_urls[0]}" target="_blank" class="text-blue-600 text-sm underline">Xem ảnh đính kèm</a>` : ''}
                        </div>
                    `;
                }

                actionHtml = `
                    ${revisionInfo}
                    <div class="mt-3 bg-gray-100 p-3 rounded">
                        <label class="block text-sm font-medium mb-1">Nộp minh chứng (Nhập link hoặc tải file):</label>
                        <div class="flex items-center space-x-2 mb-2">
                            <input type="text" id="evidence_${m.id}" class="flex-1 border p-2 text-sm rounded" placeholder="Nhập link URL (Google Drive, Github...)">
                            <input type="file" id="evidence_file_${m.id}" class="text-sm w-48 border p-1 bg-white rounded cursor-pointer" multiple onchange="handleEvidenceFileSelect(event, '${m.id}')">
                        </div>
                        <div id="preview_${m.id}" class="mb-2 grid grid-cols-2 gap-2"></div>
                        <button onclick="submitEvidenceWithFile('${m.id}')" id="btn_submit_${m.id}" class="bg-indigo-600 text-white px-4 py-2 rounded hover:bg-indigo-700 text-sm font-bold shadow mt-1">Gửi Báo Cáo / Nộp Bài</button>
                    </div>
                `;
            } else if (m.status === 'PENDING_REVIEW') {
                statusHtml = '<span class="text-blue-600 font-bold">Đang chờ Khách duyệt</span>';
                let links = '';
                if (m.proof_urls && m.proof_urls.length > 0) {
                    links = m.proof_urls.map((u, i) => `<a href="${u}" target="_blank" class="text-blue-500 underline inline-block mr-2">🔗 Tệp ${i+1}</a>`).join('');
                } else if (m.evidence_url) {
                    links = `<a href="${m.evidence_url}" target="_blank" class="text-blue-500 underline">Xem minh chứng</a>`;
                }
                actionHtml = `<div class="mt-2 p-2 bg-blue-50 border border-blue-200 rounded text-sm text-gray-700"><strong>Minh chứng đã nộp:</strong><br>${links}</div>`;
            } else if (m.status === 'APPROVED' || m.status === 'approved' || m.status === 'PAID') {
                statusHtml = '<span class="text-green-600 font-bold">Đã Nghiệm Thu (Đã Thanh Toán Token)</span>';
                actionHtml = `<p class="mt-2 text-sm text-gray-500">Tiền đã được cộng vào Ví Token của bạn theo cấu hình: ${m.payment_mode}</p>`;
            }

            return `
                <li class="bg-gray-50 p-4 rounded border border-gray-200">
                    <div class="flex justify-between items-center mb-2">
                        <span class="font-bold text-gray-800 text-lg">${m.title}</span>
                        <span>Ngân sách: <strong class="text-green-600">${m.amount} Token</strong></span>
                    </div>
                    <p class="text-sm text-gray-600 mb-1"><strong>Mô tả:</strong> ${m.description}</p>
                    <p class="text-sm text-gray-600 mb-2"><strong>Kết quả bàn giao:</strong> ${m.expected_deliverables}</p>
                    <p class="text-sm text-gray-600 mb-2"><strong>Thanh toán:</strong> ${m.payment_mode === 'PAY_PER_MILESTONE' ? 'Từng mốc' : 'Gộp cuối dự án'}</p>
                    <div class="mt-1 text-sm border-t pt-2">Trạng thái: ${statusHtml}</div>
                    ${actionHtml}
                </li>
            `;
        }

        // ---------- MILESTONE BUILDER LOGIC ----------
        let milestoneCount = 0;

        function openPlanModal(jobId) {
            document.getElementById('modal_job_id').value = jobId;
            document.getElementById('milestonesContainer').innerHTML = '';
            milestoneCount = 0;
            addMilestoneForm(); // add the first form
            document.getElementById('planModal').classList.remove('hidden');
        }

        function closePlanModal() {
            document.getElementById('planModal').classList.add('hidden');
        }

        function addMilestoneForm() {
            milestoneCount++;
            const container = document.getElementById('milestonesContainer');
            const div = document.createElement('div');
            div.className = 'bg-gray-50 p-4 rounded border border-gray-300 relative milestone-item';
            div.innerHTML = `
                <h3 class="font-bold mb-2">Giai đoạn ${milestoneCount}</h3>
                <button type="button" onclick="this.parentElement.remove()" class="absolute top-2 right-2 text-red-500 font-bold hover:text-red-700">Xóa</button>
                
                <div class="grid grid-cols-2 gap-4 mb-2">
                    <div>
                        <label class="block text-sm font-medium">Tiêu đề:</label>
                        <input type="text" class="m-title mt-1 block w-full border p-2 rounded text-sm" placeholder="VD: Bàn giao giao diện">
                    </div>
                    <div>
                        <label class="block text-sm font-medium">Trị giá (Token):</label>
                        <input type="number" class="m-amount mt-1 block w-full border p-2 rounded text-sm" placeholder="VD: 500">
                    </div>
                </div>
                
                <div class="mb-2">
                    <label class="block text-sm font-medium">Mô tả chi tiết:</label>
                    <textarea class="m-desc mt-1 block w-full border p-2 rounded text-sm" rows="2"></textarea>
                </div>
                
                <div class="mb-2">
                    <label class="block text-sm font-medium">Kết quả bàn giao (Deliverables):</label>
                    <input type="text" class="m-deliver mt-1 block w-full border p-2 rounded text-sm" placeholder="VD: Link Web, Source code">
                </div>

                <div class="mb-2">
                    <label class="block text-sm font-medium">Phương thức thanh toán:</label>
                    <select class="m-payment mt-1 block w-full border p-2 rounded text-sm">
                        <option value="PAY_PER_MILESTONE">Trả tiền ngay khi xong mốc này (Khuyến nghị)</option>
                        <option value="PAY_AT_END">Gom lại trả 1 lần ở cuối dự án</option>
                    </select>
                </div>
            `;
            container.appendChild(div);
        }

        async function submitPlan() {
            const jobId = document.getElementById('modal_job_id').value;
            const items = document.querySelectorAll('.milestone-item');
            
            if (items.length === 0) {
                alert('Vui lòng tạo ít nhất 1 giai đoạn!');
                return;
            }

            const milestones = [];
            for (let item of items) {
                const title = item.querySelector('.m-title').value;
                const amount = item.querySelector('.m-amount').value;
                const desc = item.querySelector('.m-desc').value;
                const deliver = item.querySelector('.m-deliver').value;
                const payment = item.querySelector('.m-payment').value;

                if (!title || !amount) {
                    alert('Tiêu đề và Trị giá không được bỏ trống!');
                    return;
                }

                milestones.push({
                    title: title,
                    amount: parseFloat(amount),
                    description: desc,
                    expected_deliverables: deliver,
                    payment_mode: payment
                });
            }

            try {
                const res = await fetch(`${API_URL}/api/milestones/create-plan`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ job_id: jobId, milestones: milestones })
                });
                
                const data = await res.json();
                if (res.ok) {
                    alert('Gửi kế hoạch thành công! Đang chờ Khách hàng duyệt.');
                    closePlanModal();
                    loadJobs();
                } else {
                    alert('Lỗi: ' + data.error);
                }
            } catch (err) {
                alert('Không thể kết nối Backend');
            }
        }

        // ---------- SUBMIT EVIDENCE WITH UPLOAD LOGIC ----------
        let pendingFiles = {}; // Cache file list per milestone

        function handleEvidenceFileSelect(e, mId) {
            if (!pendingFiles[mId]) pendingFiles[mId] = [];
            
            const newFiles = Array.from(e.target.files);
            pendingFiles[mId] = pendingFiles[mId].concat(newFiles);
            
            e.target.value = ''; // Reset input để có thể chọn lại chính file đó
            renderEvidencePreview(mId);
        }

        function removeEvidenceFile(mId, index) {
            if (pendingFiles[mId]) {
                pendingFiles[mId].splice(index, 1);
                renderEvidencePreview(mId);
            }
        }

        function renderEvidencePreview(mId) {
            const container = document.getElementById(`preview_${mId}`);
            if (!container) return;
            
            const files = pendingFiles[mId] || [];
            if (files.length === 0) {
                container.innerHTML = '';
                return;
            }

            container.innerHTML = files.map((f, index) => {
                const isImage = f.type.startsWith('image/');
                const previewUrl = isImage ? URL.createObjectURL(f) : '';
                return `
                    <div class="flex items-center p-2 border rounded bg-white shadow-sm justify-between w-full">
                        <div class="flex items-center space-x-2">
                            ${isImage ? `<img src="${previewUrl}" class="w-10 h-10 object-cover rounded border">` : '<span class="text-2xl">📄</span>'}
                            <div class="text-xs flex flex-col w-32">
                                <span class="font-medium truncate" title="${f.name}">${f.name}</span>
                                <span class="text-gray-500">${(f.size/1024/1024).toFixed(2)} MB</span>
                            </div>
                        </div>
                        <button onclick="removeEvidenceFile('${mId}', ${index})" class="text-red-500 hover:text-red-700 font-bold px-2 py-1 bg-red-50 rounded">Xóa</button>
                    </div>
                `;
            }).join('');
        }

        async function submitEvidenceWithFile(milestoneId) {
            const evidenceInput = document.getElementById(`evidence_${milestoneId}`).value.trim();
            const btn = document.getElementById(`btn_submit_${milestoneId}`);
            
            const files = pendingFiles[milestoneId] || [];

            if (!evidenceInput && files.length === 0) {
                alert('Vui lòng nhập link hoặc tải file minh chứng lên!');
                return;
            }

            let finalUrls = [];
            if (evidenceInput) finalUrls.push(evidenceInput);

            btn.disabled = true;

            try {
                // Lặp qua từng file để upload
                for (let i = 0; i < files.length; i++) {
                    const file = files[i];
                    btn.textContent = `Đang tải file ${i+1}/${files.length}...`;
                    
                    const formData = new FormData();
                    formData.append('file', file);
                    
                    const isImage = file.type.startsWith('image/');
                    const uploadEndpoint = isImage ? '/api/upload/image' : '/api/upload/file';
                    
                    const uploadRes = await fetch(`${API_URL}${uploadEndpoint}`, {
                        method: 'POST',
                        body: formData
                    });
                    
                    const uploadData = await uploadRes.json();
                    if (!uploadRes.ok) throw new Error(uploadData.error || 'Upload file thất bại');
                    
                    finalUrls.push(uploadData.url);
                }

                btn.textContent = 'Đang nộp báo cáo...';
                const submitRes = await fetch(`${API_URL}/api/milestones/advanced/submit`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        milestone_id: milestoneId, 
                        proof_urls: finalUrls, 
                        report_text: finalUrls.join('\n')
                    })
                });

                if (submitRes.ok) {
                    alert('Nộp bài thành công! File/Link đã được gửi cho Khách hàng.');
                    delete pendingFiles[milestoneId];
                    loadJobs();
                } else {
                    const submitData = await submitRes.json();
                    alert('Lỗi nộp bài: ' + submitData.error);
                    btn.disabled = false;
                    btn.textContent = 'Gửi Báo Cáo / Nộp Bài';
                }
            } catch (err) {
                alert('Lỗi tải file: ' + err.message);
                btn.disabled = false;
                btn.textContent = 'Gửi Báo Cáo / Nộp Bài';
            }
        }

        // ---------- CHAT LOGIC ----------
        async function openChatModal(jobId) {
            document.getElementById('chat_job_id').value = jobId;
            document.getElementById('chatModal').classList.remove('hidden');
            loadChatMessages(jobId);
        }

        function closeChatModal() {
            document.getElementById('chatModal').classList.add('hidden');
        }

        async function loadChatMessages(jobId) {
            const chatBox = document.getElementById('chatMessages');
            
            try {
                const res = await fetch(`${API_URL}/api/jobs/${jobId}/messages`);
                const data = await res.json();
                if (res.ok) {
                    if (data.messages.length === 0) {
                        chatBox.innerHTML = '<p class="text-center text-gray-500 mt-4">Chưa có tin nhắn nào. Bắt đầu thảo luận!</p>';
                    } else {
                        chatBox.innerHTML = data.messages.map(msg => renderMessage(msg)).join('');
                        chatBox.scrollTop = chatBox.scrollHeight;
                    }
                }
            } catch (err) {
                chatBox.innerHTML = '<p class="text-center text-red-500 mt-4">Lỗi kết nối Server!</p>';
            }
        }

        function renderMessage(msg) {
            const isMe = msg.sender_id === currentUser.id;
            const timeStr = new Date(msg.created_at).toLocaleTimeString('vi-VN', {hour: '2-digit', minute:'2-digit'});
            const roleBadge = msg.users.role === 'client' ? '<span class="text-[10px] bg-blue-100 text-blue-800 px-1 rounded ml-1">KHÁCH HÀNG</span>' : '<span class="text-[10px] bg-green-100 text-green-800 px-1 rounded ml-1">FREELANCER</span>';
            
            let fileHtml = '';
            if (msg.file_url) {
                if (msg.file_type === 'image') {
                    fileHtml = `<div class="mt-2"><img src="${msg.file_url}" class="max-w-[200px] rounded-lg border border-gray-200 cursor-pointer" onclick="window.open('${msg.file_url}', '_blank')"></div>`;
                } else if (msg.file_type === 'video') {
                    fileHtml = `<div class="mt-2"><video src="${msg.file_url}" controls class="max-w-[250px] rounded-lg"></video></div>`;
                } else {
                    fileHtml = `<div class="mt-2"><a href="${msg.file_url}" target="_blank" class="flex items-center text-sm underline ${isMe ? 'text-white' : 'text-blue-600'}">📁 Tải File đính kèm</a></div>`;
                }
            }

            return `
                <div class="flex flex-col ${isMe ? 'items-end' : 'items-start'}">
                    <div class="text-xs text-gray-500 mb-1 flex items-center">${msg.users.full_name} ${roleBadge} - ${timeStr}</div>
                    <div class="max-w-[80%] rounded-lg p-3 ${isMe ? 'bg-blue-600 text-white rounded-tr-none' : 'bg-white text-gray-800 rounded-tl-none border shadow-sm'}">
                        ${msg.content ? `<p class="text-sm whitespace-pre-wrap">${msg.content}</p>` : ''}
                        ${fileHtml}
                    </div>
                </div>
            `;
        }

        async function sendChatMessage() {
            const jobId = document.getElementById('chat_job_id').value;
            const contentInput = document.getElementById('chatInput');
            const fileInput = document.getElementById('chatFile');
            const chatBox = document.getElementById('chatMessages');
            
            const content = contentInput.value.trim();
            const files = Array.from(fileInput.files || []);

            if (!content && files.length === 0) return;

            // Xóa form ngay lập tức để UX mượt
            contentInput.value = '';
            fileInput.value = '';

            // 1. Gửi tin nhắn Text trước nếu có
            if (content) {
                fetch(`${API_URL}/api/jobs/${jobId}/messages`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ sender_id: currentUser.id, content: content })
                }).then(() => loadChatMessages(jobId));
            }

            // 2. Gửi file (Async từng file để hiện progress)
            for (let file of files) {
                const tempId = 'temp_' + Date.now() + Math.random().toString(36).substr(2, 9);
                const tempHtml = `
                    <div id="${tempId}" class="flex flex-col items-end">
                        <div class="text-xs text-gray-500 mb-1 flex items-center">Đang gửi...</div>
                        <div class="max-w-[80%] rounded-lg p-3 bg-blue-300 text-white rounded-tr-none flex items-center space-x-2">
                            <span class="animate-spin rounded-full h-4 w-4 border-t-2 border-white border-solid"></span>
                            <span class="text-sm">Đang tải lên: ${file.name}</span>
                        </div>
                    </div>
                `;
                chatBox.insertAdjacentHTML('beforeend', tempHtml);
                chatBox.scrollTop = chatBox.scrollHeight;

                const formData = new FormData();
                formData.append('file', file);
                
                const isImage = file.type.startsWith('image/');
                const uploadEndpoint = isImage ? '/api/upload/image' : '/api/upload/file';

                try {
                    const uploadRes = await fetch(`${API_URL}${uploadEndpoint}`, { method: 'POST', body: formData });
                    const uploadData = await uploadRes.json();
                    
                    if (!uploadRes.ok) throw new Error(uploadData.error || 'Upload thất bại');

                    // Gửi URL vào message DB
                    await fetch(`${API_URL}/api/jobs/${jobId}/messages`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ sender_id: currentUser.id, file_url: uploadData.url, file_type: uploadData.type })
                    });
                    
                    document.getElementById(tempId).remove();
                    loadChatMessages(jobId);
                } catch (err) {
                    const tempDiv = document.getElementById(tempId);
                    if (tempDiv) tempDiv.innerHTML = `<p class="text-red-500 text-sm p-2 bg-red-100 rounded border border-red-300">❌ Lỗi tải ${file.name}: ${err.message}</p>`;
                }
            }
        }

        loadJobs();
    </script>
</body>
</html>
