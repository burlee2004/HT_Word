[build]
  publish = "Front_end"

# 1. Chuyen huong ten mien goc vao thang trang dang nhap
[[redirects]]
  from = "/"
  to = "/sharedFolder/login.html"
  status = 301
  force = true

# 2. Ho tro cac duong dan dang nhap rut gon
[[redirects]]
  from = "/login"
  to = "/sharedFolder/login.html"
  status = 200

[[redirects]]
  from = "/login.html"
  to = "/sharedFolder/login.html"
  status = 200

# 3. Ho tro duong dan dang ky
[[redirects]]
  from = "/register"
  to = "/sharedFolder/register.html"
  status = 200

[[redirects]]
  from = "/register.html"
  to = "/sharedFolder/register.html"
  status = 200

# 4. Security Headers bao ve toan dien (Dat chuan Grade A / A+)
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Content-Security-Policy = "default-src 'self' 'unsafe-inline' 'unsafe-eval' data: blob: https:; img-src 'self' data: blob: https:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https:; style-src 'self' 'unsafe-inline' https:; font-src 'self' data: https:; connect-src 'self' https: wss:; frame-src 'self' https:;"

