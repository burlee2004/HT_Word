<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Duyệt Nạp Tiền</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-10 font-sans">
    <div class="max-w-5xl mx-auto">
        <h1 class="text-3xl font-bold text-gray-800 mb-6">Duyệt Lệnh Nạp Token</h1>
        
        <div class="bg-white p-6 rounded-lg shadow-md">
            <div class="overflow-x-auto">
                <table class="min-w-full bg-white">
                    <thead class="bg-gray-50 text-gray-600 uppercase text-sm leading-normal">
                        <tr>
                            <th class="py-3 px-6 text-left">Thời gian</th>
                            <th class="py-3 px-6 text-left">Người dùng</th>
                            <th class="py-3 px-6 text-left">Mã Chuyển Khoản</th>
                            <th class="py-3 px-6 text-right">Số Token Nạp</th>
                            <th class="py-3 px-6 text-center">Thao tác</th>
                        </tr>
                    </thead>
                    <tbody id="depositsTableBody" class="text-gray-600 text-sm font-light">
                        <tr>
                            <td colspan="5" class="py-3 px-6 text-center">Đang tải dữ liệu...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Modal Thành Công (Dấu X và icon xanh) -->
    <div id="successModal" class="fixed inset-0 bg-gray-600 bg-opacity-50 hidden flex justify-center items-center z-50">
        <div class="bg-white p-6 rounded-lg shadow-xl max-w-sm w-full text-center relative">
            <button onclick="closeSuccessModal()" class="absolute top-2 right-4 text-gray-400 hover:text-gray-600 text-2xl font-bold">&times;</button>
            <div class="mx-auto flex items-center justify-center h-16 w-16 rounded-full bg-green-100 mb-4">
                <svg class="h-10 w-10 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
                </svg>
            </div>
            <h2 class="text-xl font-bold text-gray-800 mb-2">Giao dịch đã hoàn thành!</h2>
            <p class="text-gray-500 mb-6">Đã nạp Token thành công vào ví của người dùng.</p>
            <button onclick="closeSuccessModal()" class="bg-green-600 text-white px-6 py-2 rounded-full font-bold hover:bg-green-700 shadow w-full">Về Trang Chủ</button>
        </div>
    </div>

    <script>
        const API_URL = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' 
            ? 'http://localhost:5000' 
            : 'https://htwork-backend.onrender.com';

        async function loadDeposits() {
            const tbody = document.getElementById('depositsTableBody');
            tbody.innerHTML = '<tr><td colspan="5" class="py-3 px-6 text-center">Đang tải dữ liệu...</td></tr>';

            try {
                const response = await fetch(`${API_URL}/api/admin/deposits`);
                const data = await response.json();

                if (data.deposits && data.deposits.length > 0) {
                    tbody.innerHTML = data.deposits.map(d => {
                        const date = new Date(d.created_at).toLocaleString('vi-VN');
                        const userName = d.users ? d.users.full_name : 'Không rõ';
                        const transferCode = 'HTword ' + d.id.substring(0, 6).toUpperCase();
                        
                        return `
                            <tr class="border-b border-gray-200 hover:bg-gray-50">
                                <td class="py-3 px-6 text-left">${date}</td>
                                <td class="py-3 px-6 text-left font-medium">${userName}</td>
                                <td class="py-3 px-6 text-left">
                                    <span class="bg-gray-100 text-blue-700 font-bold px-2 py-1 rounded border border-gray-200 tracking-wider">
                                        ${transferCode}
                                    </span>
                                </td>
                                <td class="py-3 px-6 text-right font-bold text-green-600">+${parseInt(d.amount).toLocaleString()}</td>
                                <td class="py-3 px-6 text-center flex justify-center space-x-2">
                                    <button onclick="approveDeposit('${d.id}')" class="bg-blue-600 text-white px-4 py-1 rounded shadow hover:bg-blue-700 transition">
                                        Phê Duyệt
                                    </button>
                                    <button onclick="rejectDeposit('${d.id}')" class="bg-red-500 text-white px-4 py-1 rounded shadow hover:bg-red-600 transition">
                                        Từ Chối
                                    </button>
                                </td>
                            </tr>
                        `;
                    }).join('');
                } else {
                    tbody.innerHTML = '<tr><td colspan="5" class="py-3 px-6 text-center text-gray-500">Không có lệnh nạp tiền nào đang chờ.</td></tr>';
                }
            } catch (error) {
                tbody.innerHTML = '<tr><td colspan="5" class="py-3 px-6 text-center text-red-500">Lỗi kết nối Backend.</td></tr>';
            }
        }

        async function approveDeposit(requestId) {
            // Lấy user admin từ localStorage
            const userStr = localStorage.getItem('user');
            const adminId = userStr ? JSON.parse(userStr).id : '11111111-1111-1111-1111-111111111111';

            // Show a simple loading state if needed, or just standard confirm
            if (!confirm('Xác nhận duyệt nạp tiền cho giao dịch này?')) return;

            try {
                const response = await fetch(`${API_URL}/api/admin/deposits/approve`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ request_id: requestId, admin_id: adminId })
                });
                
                const data = await response.json();
                if (response.ok) {
                    // Hiển thị modal thành công thay vì alert
                    document.getElementById('successModal').classList.remove('hidden');
                    loadDeposits(); // Reload list
                } else {
                    alert('Lỗi: ' + data.error);
                }
            } catch (err) {
                alert('Không thể kết nối đến Backend');
            }
        }

        async function rejectDeposit(requestId) {
            if (!confirm('Bạn có chắc chắn muốn TỪ CHỐI lệnh nạp tiền này?')) return;

            try {
                const response = await fetch(`${API_URL}/api/admin/deposits/reject`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ request_id: requestId })
                });
                
                const data = await response.json();
                if (response.ok) {
                    alert('Đã từ chối lệnh nạp tiền thành công.');
                    loadDeposits(); // Reload list
                } else {
                    alert('Lỗi: ' + data.error);
                }
            } catch (err) {
                alert('Không thể kết nối đến Backend');
            }
        }

        function closeSuccessModal() {
            document.getElementById('successModal').classList.add('hidden');
            window.location.href = 'home.html'; // Về trang chủ
        }

        loadDeposits();
    </script>
</body>
</html>
