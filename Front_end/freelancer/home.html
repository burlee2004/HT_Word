<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Workspace - HT Work</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 h-screen flex flex-col">
    <nav class="bg-indigo-600 p-4 text-white flex justify-between shadow-md">
        <div class="font-bold">HT Work - Freelancer Workspace</div>
        <div>
            <span id="freelancerName" class="mr-4 font-medium"></span>
            <button id="logoutBtn" class="bg-indigo-800 px-3 py-1 rounded">Đăng xuất</button>
        </div>
    </nav>
    <main class="p-10">
        <div class="bg-white p-6 rounded-lg shadow border-l-4 border-indigo-500">
            <h2 class="text-2xl font-bold text-gray-800">Bảng Công Việc (Task Board)</h2>
            <p class="mt-2 text-gray-600">Đang chờ khách hàng duyệt báo giá dự án mới...</p>
            <div class="mt-4 flex space-x-4">
                <a href="job-board.html" class="bg-indigo-600 text-white px-4 py-2 rounded hover:bg-indigo-700 inline-block">Vào Chợ Việc Làm (Tìm việc mới)</a>
                <a href="my-jobs.html" class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700 inline-block">Dự án Đang thực hiện (Nộp bài)</a>
            </div>
        </div>
    </main>
    <script>
        const user = JSON.parse(localStorage.getItem('user'));
        if (!user || user.role !== 'freelancer') { window.location.href = '../sharedFolder/login.html'; }
        document.getElementById('freelancerName').textContent = user.full_name;
        document.getElementById('logoutBtn').addEventListener('click', () => { localStorage.clear(); window.location.href = '../sharedFolder/login.html'; });
    </script>
</body>
</html>
