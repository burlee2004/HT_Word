<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - HT Work</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-10 font-sans">
    <div class="max-w-6xl mx-auto">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-3xl font-bold text-gray-800">Bảng điều khiển Quản Trị Viên (Admin)</h1>
            <button onclick="loadTransactions()" class="bg-blue-600 text-white px-4 py-2 rounded shadow hover:bg-blue-700">Làm mới dữ liệu</button>
        </div>
        
        <div class="bg-white p-6 rounded-lg shadow-md mb-8">
            <h2 class="text-xl font-bold text-gray-700 border-b pb-2 mb-4">Sổ cái Giao dịch (Token Ledger)</h2>
            <div class="overflow-x-auto">
                <table class="min-w-full bg-white">
                    <thead class="bg-gray-50 text-gray-600 uppercase text-sm leading-normal">
                        <tr>
                            <th class="py-3 px-6 text-left">Thời gian</th>
                            <th class="py-3 px-6 text-left">Người dùng</th>
                            <th class="py-3 px-6 text-left">Loại giao dịch</th>
                            <th class="py-3 px-6 text-right">Số lượng (Token)</th>
                            <th class="py-3 px-6 text-center">Trạng thái</th>
                        </tr>
                    </thead>
                    <tbody id="transactionTableBody" class="text-gray-600 text-sm font-light">
                        <tr>
                            <td colspan="5" class="py-3 px-6 text-center">Đang tải dữ liệu...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const API_URL = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' 
            ? 'http://localhost:5000' 
            : 'https://htwork-backend.onrender.com';

        async function loadTransactions() {
            const tbody = document.getElementById('transactionTableBody');
            tbody.innerHTML = '<tr><td colspan="5" class="py-3 px-6 text-center">Đang tải dữ liệu...</td></tr>';

            try {
                const response = await fetch(`${API_URL}/api/admin/transactions`);
                const data = await response.json();

                if (data.transactions && data.transactions.length > 0) {
                    tbody.innerHTML = data.transactions.map(t => {
                        const date = new Date(t.created_at).toLocaleString('vi-VN');
                        const userName = t.users ? t.users.full_name : 'Không rõ';
                        const role = t.users ? `(${t.users.role})` : '';
                        
                        let typeHtml = '';
                        switch(t.type) {
                            case 'escrow_lock':
                                typeHtml = '<span class="bg-yellow-100 text-yellow-800 py-1 px-3 rounded-full text-xs">Khóa Escrow</span>';
                                break;
                            case 'deposit':
                                typeHtml = '<span class="bg-green-100 text-green-800 py-1 px-3 rounded-full text-xs">Nạp Token</span>';
                                break;
                            default:
                                typeHtml = `<span class="bg-gray-100 text-gray-800 py-1 px-3 rounded-full text-xs">${t.type}</span>`;
                        }

                        return `
                            <tr class="border-b border-gray-200 hover:bg-gray-50">
                                <td class="py-3 px-6 text-left whitespace-nowrap">${date}</td>
                                <td class="py-3 px-6 text-left font-medium">${userName} <span class="text-xs text-gray-400">${role}</span></td>
                                <td class="py-3 px-6 text-left">${typeHtml}</td>
                                <td class="py-3 px-6 text-right font-bold ${t.type === 'escrow_lock' ? 'text-red-500' : 'text-gray-700'}">
                                    ${t.type === 'escrow_lock' ? '-' : '+'}${t.amount}
                                </td>
                                <td class="py-3 px-6 text-center">
                                    <span class="bg-green-500 text-white py-1 px-3 rounded-full text-xs">Thành công</span>
                                </td>
                            </tr>
                        `;
                    }).join('');
                } else {
                    tbody.innerHTML = '<tr><td colspan="5" class="py-3 px-6 text-center text-gray-500">Chưa có giao dịch nào trên hệ thống.</td></tr>';
                }
            } catch (error) {
                tbody.innerHTML = '<tr><td colspan="5" class="py-3 px-6 text-center text-red-500">Lỗi kết nối Backend.</td></tr>';
            }
        }

        // Tải dữ liệu khi mở trang
        loadTransactions();
    </script>
</body>
</html>
