<!DOCTYPE html>
<html lang="vi" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quên mật khẩu | HT Work</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        brand: { 50: '#eff6ff', 100: '#dbeafe', 500: '#3b82f6', 600: '#2563eb', 900: '#1e3a8a' }
                    }
                }
            }
        };
    </script>
</head>
<body class="bg-gray-50 dark:bg-gray-950 text-gray-800 dark:text-gray-200 min-h-screen flex flex-col antialiased transition-colors duration-300">

    <header class="bg-white/80 dark:bg-gray-900/80 backdrop-blur-md border-b border-gray-200 dark:border-gray-800 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <a href="../index.html" class="flex items-center gap-2 group">
                <div class="w-8 h-8 sm:w-10 sm:h-10 rounded-xl bg-gradient-to-br from-indigo-600 to-purple-600 flex items-center justify-center text-white font-black text-lg sm:text-xl shadow-lg shadow-indigo-500/30 group-hover:scale-105 transition-transform">HT</div>
                <span class="text-xl sm:text-2xl font-black bg-clip-text text-transparent bg-gradient-to-r from-gray-900 to-gray-700 dark:from-white dark:to-gray-300 tracking-tight">Work</span>
            </a>
            <button onclick="document.documentElement.classList.toggle('dark')" class="w-10 h-10 rounded-full flex items-center justify-center text-gray-500 hover:bg-gray-100 dark:hover:bg-gray-800 transition">
                <i class="fas fa-moon dark:hidden"></i>
                <i class="fas fa-sun hidden dark:block text-yellow-400"></i>
            </button>
        </div>
    </header>

    <main class="flex-1 flex items-center justify-center p-4 sm:p-6 md:p-10">
        <div class="w-full max-w-md mx-auto">
            <div class="bg-white dark:bg-gray-900 rounded-3xl p-6 sm:p-8 shadow-2xl border border-gray-100 dark:border-gray-800 relative overflow-hidden">
                
                <!-- Step 1: Nhập Email -->
                <div id="stepEmail">
                    <div class="text-center mb-6">
                        <div class="w-16 h-16 rounded-2xl bg-indigo-50 dark:bg-indigo-950/60 border border-indigo-100 dark:border-indigo-800/60 flex items-center justify-center text-indigo-600 dark:text-indigo-400 text-3xl mx-auto mb-4 shadow-sm">
                            <i class="fas fa-key"></i>
                        </div>
                        <h1 class="text-2xl sm:text-3xl font-black text-gray-900 dark:text-white tracking-tight">Quên Mật Khẩu</h1>
                        <p class="text-xs sm:text-sm text-gray-500 dark:text-gray-400 mt-2">Nhập email của bạn để nhận mã xác thực (OTP) đặt lại mật khẩu.</p>
                    </div>

                    <form id="forgotForm" class="space-y-4">
                        <div>
                            <label class="block text-sm font-bold text-gray-700 dark:text-gray-300 mb-1.5">Địa chỉ Email <span class="text-red-500">*</span></label>
                            <div class="relative">
                                <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-gray-400"><i class="fas fa-envelope"></i></div>
                                <input type="email" id="email" required placeholder="Nhập email của bạn..." class="w-full pl-10 pr-4 py-3 bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 transition">
                            </div>
                        </div>

                        <button type="submit" id="btnSendOtp" class="w-full py-3 px-4 bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-700 hover:to-purple-700 text-white rounded-xl text-sm font-bold shadow-lg shadow-indigo-500/30 transition-all flex justify-center items-center">
                            <span>Gửi mã xác thực</span>
                        </button>
                        
                        <div class="text-center mt-4">
                            <a href="login.html" class="text-sm font-bold text-gray-500 hover:text-indigo-600 dark:hover:text-indigo-400 transition flex items-center justify-center">
                                <i class="fas fa-arrow-left mr-2"></i> Quay lại Đăng nhập
                            </a>
                        </div>
                    </form>
                </div>

                <!-- Step 2: Nhập OTP & Đổi Mật Khẩu -->
                <div id="stepReset" class="hidden">
                    <div class="text-center mb-6">
                        <div class="w-16 h-16 rounded-2xl bg-emerald-50 dark:bg-emerald-950/60 border border-emerald-100 dark:border-emerald-800/60 flex items-center justify-center text-emerald-600 dark:text-emerald-400 text-3xl mx-auto mb-4 shadow-sm">
                            <i class="fas fa-shield-check"></i>
                        </div>
                        <h1 class="text-2xl sm:text-3xl font-black text-gray-900 dark:text-white tracking-tight">Tạo Mật Khẩu Mới</h1>
                        <p class="text-xs sm:text-sm text-gray-500 dark:text-gray-400 mt-2">Mã xác thực đã được gửi tới <strong id="dispEmail" class="text-gray-800 dark:text-gray-200"></strong></p>
                    </div>

                    <form id="resetForm" class="space-y-4">
                        <div>
                            <div class="flex justify-between items-center mb-1.5">
                                <label class="block text-sm font-bold text-gray-700 dark:text-gray-300">Mã OTP (6 số) <span class="text-red-500">*</span></label>
                                <span id="otpTimer" class="text-xs font-bold text-red-500 bg-red-50 dark:bg-red-900/30 px-2 py-0.5 rounded-md">05:00</span>
                            </div>
                            <input type="text" id="otp" required maxlength="6" pattern="[0-9]{6}" placeholder="Nhập 6 số..." class="w-full px-4 py-3 bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-xl text-center text-xl tracking-[0.5em] font-black focus:outline-none focus:ring-2 focus:ring-emerald-500 transition">
                        </div>

                        <div>
                            <label class="block text-sm font-bold text-gray-700 dark:text-gray-300 mb-1.5">Mật khẩu mới <span class="text-red-500">*</span></label>
                            <div class="relative">
                                <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-gray-400"><i class="fas fa-lock"></i></div>
                                <input type="password" id="newPassword" required minlength="6" placeholder="Ít nhất 6 ký tự" class="w-full pl-10 pr-4 py-3 bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 transition">
                            </div>
                        </div>

                        <div>
                            <label class="block text-sm font-bold text-gray-700 dark:text-gray-300 mb-1.5">Xác nhận Mật khẩu mới <span class="text-red-500">*</span></label>
                            <div class="relative">
                                <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-gray-400"><i class="fas fa-check-double"></i></div>
                                <input type="password" id="confirmPassword" required minlength="6" placeholder="Nhập lại mật khẩu mới" class="w-full pl-10 pr-4 py-3 bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 transition">
                            </div>
                        </div>

                        <button type="submit" id="btnResetPassword" class="w-full py-3 px-4 bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-600 hover:to-teal-700 text-white rounded-xl text-sm font-bold shadow-lg shadow-emerald-500/30 transition-all flex justify-center items-center mt-2">
                            <span>Lưu mật khẩu & Đăng nhập</span>
                        </button>
                    </form>
                </div>

            </div>
        </div>
    </main>

    <script>
        const API_URL = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' 
            ? 'http://localhost:5000' 
            : 'https://htwork-backend.onrender.com';

        let targetEmail = '';
        let countdownInterval;

        document.getElementById('forgotForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const btn = document.getElementById('btnSendOtp');

            if (!email) return alert('Vui lòng nhập email');

            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i> Đang xử lý...';

            try {
                console.log("--- BẮT ĐẦU GỬI YÊU CẦU QUÊN MẬT KHẨU ---");
                console.log("URL:", `${API_URL}/api/auth/forgot-password`);
                console.log("Payload:", { email });

                const res = await fetch(`${API_URL}/api/auth/forgot-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });
                
                console.log("Response status:", res.status);
                
                const data = await res.json();
                console.log("Response data:", data);
                
                if (res.ok) {
                    targetEmail = email;
                    document.getElementById('dispEmail').innerText = email;
                    document.getElementById('stepEmail').classList.add('hidden');
                    document.getElementById('stepReset').classList.remove('hidden');
                    
                    if (data.demo_otp) {
                        console.warn("DEMO OTP:", data.demo_otp);
                    }
                    
                    startTimer(300); // 5 minutes
                } else {
                    alert('Lỗi: ' + (data.error || 'Không thể gửi email OTP'));
                }
            } catch (err) {
                console.error("LỖI KẾT NỐI MÁY CHỦ CHI TIẾT:", err);
                alert('Lỗi kết nối máy chủ. Hãy mở Developer Tools (F12) -> tab Console để xem chi tiết lỗi!');
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<span>Gửi mã xác thực</span>';
            }
        });

        document.getElementById('resetForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const otp = document.getElementById('otp').value.trim();
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const btn = document.getElementById('btnResetPassword');

            if (newPassword !== confirmPassword) {
                return alert('Mật khẩu xác nhận không khớp!');
            }

            if (newPassword.length < 6) {
                return alert('Mật khẩu phải có ít nhất 6 ký tự!');
            }

            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i> Đang cập nhật...';

            try {
                const res = await fetch(`${API_URL}/api/auth/reset-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: targetEmail, otp, newPassword })
                });
                
                const data = await res.json();
                
                if (res.ok) {
                    alert('✅ Đổi mật khẩu thành công! Hãy đăng nhập bằng mật khẩu mới.');
                    window.location.href = 'login.html';
                } else {
                    alert('❌ Lỗi: ' + (data.error || 'Không thể đặt lại mật khẩu'));
                    document.getElementById('otp').value = '';
                }
            } catch (err) {
                alert('Lỗi kết nối máy chủ');
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<span>Lưu mật khẩu & Đăng nhập</span>';
            }
        });

        function startTimer(seconds) {
            clearInterval(countdownInterval);
            let rem = seconds;
            const display = document.getElementById('otpTimer');
            countdownInterval = setInterval(() => {
                rem--;
                const m = Math.floor(rem / 60).toString().padStart(2, '0');
                const s = (rem % 60).toString().padStart(2, '0');
                display.innerText = `${m}:${s}`;
                if (rem <= 0) clearInterval(countdownInterval);
            }, 1000);
        }
    </script>
</body>
</html>
