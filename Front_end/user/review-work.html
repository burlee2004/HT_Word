<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khách hàng - Nghiệm thu Công việc</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 p-10">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-3xl font-bold text-gray-800 mb-6">Nghiệm thu Milestone (Báo cáo Tiến độ)</h1>
        <p class="text-gray-600 mb-4">Các giai đoạn Freelancer đã nộp bài, đang chờ bạn kiểm tra file và giải ngân (Giải phóng Token Escrow).</p>
        
        <div id="milestoneList" class="space-y-4">
            <p class="text-gray-500">Đang tải...</p>
        </div>
    </div>

    <script>
        const API_URL = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' 
            ? 'http://localhost:5000' 
            : 'https://htwork-backend.onrender.com';

        let currentUser = null;

        async function loadPendingMilestones() {
            const userStr = localStorage.getItem('user');
            if (!userStr) {
                alert('Bạn chưa đăng nhập!');
                window.location.replace('../sharedFolder/login.html');
                return;
            }
            currentUser = JSON.parse(userStr);

            const listDiv = document.getElementById('milestoneList');
            try {
                const response = await fetch(`${API_URL}/api/client/${currentUser.id}/pending-milestones`);
                const data = await response.json();
                
                if (data.milestones && data.milestones.length > 0) {
                    listDiv.innerHTML = data.milestones.map(m => `
                        <div class="bg-white p-6 rounded-lg shadow-md border-l-4 border-yellow-500">
                            <h3 class="text-xl font-bold text-gray-800">Dự án: ${m.jobs ? m.jobs.title : ''}</h3>
                            <p class="text-gray-700 mt-2"><strong>Giai đoạn:</strong> ${m.description}</p>
                            <p class="text-gray-700 mt-1"><strong>File báo cáo:</strong> <a href="${m.evidence_url}" target="_blank" class="text-blue-600 underline font-medium">Bấm vào đây để Xem/Tải File</a></p>
                            <p class="text-gray-700 mt-1"><strong>Số tiền giải ngân:</strong> <span class="font-bold text-red-600">${m.amount} Token</span></p>
                            
                            <div class="mt-6 flex space-x-4">
                                <button onclick="releaseEscrow('${m.id}', ${m.amount})" class="bg-green-600 text-white px-6 py-2 rounded font-bold hover:bg-green-700 shadow">
                                    Nghiệm Thu & Giải Ngân
                                </button>
                                <button onclick="rejectWork()" class="bg-red-100 text-red-600 px-6 py-2 rounded font-bold hover:bg-red-200">
                                    Từ chối (Yêu cầu sửa)
                                </button>
                            </div>
                        </div>
                    `).join('');
                } else {
                    listDiv.innerHTML = '<p class="text-gray-500 bg-white p-6 rounded shadow">Hiện không có công việc nào đang chờ duyệt.</p>';
                }
            } catch (err) {
                listDiv.innerHTML = '<p class="text-red-500">Lỗi kết nối Server!</p>';
            }
        }

        async function releaseEscrow(milestoneId, amount) {
            if (!confirm('Bạn có chắc chắn file báo cáo đã đạt yêu cầu? Bấm OK hệ thống sẽ tự động trừ ' + amount + ' Token bị khóa để trả cho Freelancer.')) return;

            const payload = {
                client_id: currentUser.id,
                milestone_id: milestoneId,
                amount: amount
            };

            try {
                const response = await fetch(`${API_URL}/api/escrow/release`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                const data = await response.json();
                if (response.ok) {
                    alert('Thành công: ' + data.message);
                    loadPendingMilestones();
                } else {
                    alert('Lỗi: ' + data.error);
                }
            } catch (err) {
                alert('Không thể kết nối đến Backend');
            }
        }

        function rejectWork() {
            alert('Tính năng yêu cầu chỉnh sửa (Revision) sẽ được cập nhật ở phiên bản sau.');
        }

        loadPendingMilestones();
    </script>
</body>
</html>
