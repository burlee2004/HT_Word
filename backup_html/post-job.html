        <!-- Filter & Search Bar -->

                    <option value="open">Äang má»Ÿ (Open)</option>

    <!-- Modal ÄÄƒng Dá»± Ãn -->
    <div id="postModal" class="hidden fixed inset-0 bg-black bg-opacity-60 z-50 flex items-center justify-center p-4">
        <div class="bg-white dark:bg-gray-800 dark:border-gray-700 rounded-2xl shadow-2xl max-w-2xl w-full max-h-[90vh] flex flex-col">
            <div class="p-6 border-b flex justify-between items-center">

            </div>
            <div class="p-6 overflow-y-auto">

                    <div>

                        <input type="text" id="title" required class="w-full border border-gray-300 rounded-lg p-3 focus:ring-2 focus:ring-blue-500" placeholder="Vd: Thiáº¿t káº¿ Website BÃ¡n HÃ ng">

                    <div>

                        <textarea id="description" required rows="5" class="w-full border border-gray-300 rounded-lg p-3 focus:ring-2 focus:ring-blue-500" placeholder="MÃ´ táº£ chi tiáº¿t yÃªu cáº§u, ngÃ´n ngá»¯, framework..."></textarea>
                    </div>
                    <div>

    <!-- Modal Xem Chi Tiáº¿t Dá»± Ãn -->

            <div class="p-6 border-b flex justify-between items-start">
                <div>

                    <p class="text-sm text-gray-500 dark:text-gray-400 mt-1"><i class="far fa-calendar-alt mr-1"></i> NgÃ y Ä‘Äƒng: <span id="detailDate"></span></p>
                </div>
                <button onclick="closeDetailModal()" class="text-gray-400 hover:text-red-500 text-2xl font-bold">&times;</button>

            <div class="p-6 overflow-y-auto space-y-4">

                    <span class="px-3 py-1 rounded-full text-sm font-bold bg-green-100 text-green-700 border border-green-200"><i class="fas fa-coins mr-1"></i> <span id="detailBudget"></span> Token</span>
                </div>
                <div>
                    <h3 class="font-bold text-gray-800 dark:text-gray-100 text-lg border-b pb-2 mb-3">MÃ´ táº£ cÃ´ng viá»‡c</h3>
                    <p id="detailDesc" class="text-gray-700 whitespace-pre-wrap leading-relaxed bg-gray-50 p-4 rounded-lg border"></p>
                </div>
            </div>
            <div class="p-6 border-t bg-gray-50 rounded-b-2xl flex justify-end">
                <button onclick="closeDetailModal()" class="bg-gray-300 text-gray-800 dark:text-gray-100 px-6 py-2 rounded-lg font-bold hover:bg-gray-400 transition">ÄÃ³ng</button>
            </div>
        </div>
    </div>

    <script>
        const API_URL = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' 
            ? 'http://localhost:5000' 
            : 'https://htwork-backend.onrender.com';

        let currentUser = null;
        let allJobs = [];

        // Kiá»ƒm tra Auth
        const userStr = localStorage.getItem('user');
        if (!userStr) {
            window.location.replace('../sharedFolder/login.html');
        } else {
            currentUser = JSON.parse(userStr);
            document.getElementById('client_id').value = currentUser.id;
            loadJobs();
        }

        // Táº£i danh sÃ¡ch dá»± Ã¡n
        async function loadJobs() {
            const listDiv = document.getElementById('jobsList');
            listDiv.innerHTML = '<p class="text-gray-500 dark:text-gray-400 col-span-full text-center py-10"><i class="fas fa-spinner fa-spin mr-2"></i>Äang táº£i dá»¯ liá»‡u...</p>';
            
            try {
                const response = await fetch(`${API_URL}/api/client/${currentUser.id}/my-jobs`);
                const data = await response.json();
                
                if (response.ok && data.jobs) {
                    allJobs = data.jobs;
                    renderJobs(allJobs);
                } else {
                    allJobs = [];
                    renderJobs([]);
                }
            } catch (err) {
                listDiv.innerHTML = '<p class="text-red-500 col-span-full text-center py-10">Lá»—i káº¿t ná»‘i Server!</p>';
            }
        }

        // Render dá»± Ã¡n ra UI
        function renderJobs(jobsToRender) {
            const listDiv = document.getElementById('jobsList');
            if (jobsToRender.length === 0) {
                listDiv.innerHTML = `
                <div class="col-span-full bg-white dark:bg-gray-800 dark:border-gray-700 p-10 rounded-xl shadow-sm text-center border">
                    <div class="text-gray-300 text-5xl mb-4"><i class="fas fa-folder-open"></i></div>
                    <p class="text-gray-500 dark:text-gray-400 text-lg">KhÃ´ng tÃ¬m tháº¥y dá»± Ã¡n nÃ o.</p>
                </div>`;
                return;
            }

            listDiv.innerHTML = jobsToRender.map(job => {
                let statusClass = 'bg-gray-100 text-gray-700 border-gray-300';
                let statusText = job.status;
                let iconClass = 'fa-file-alt';

                if (job.status === 'open') {
                    statusClass = 'bg-blue-50 text-blue-700 border-blue-300';
                    statusText = 'Äang má»Ÿ';
                    iconClass = 'fa-door-open';
                } else if (job.status === 'in_progress') {
                    statusClass = 'bg-yellow-50 text-yellow-700 border-yellow-300';
                    statusText = 'Äang thá»±c hiá»‡n';
                    iconClass = 'fa-spinner fa-spin';
                } else if (job.status === 'completed' || job.status === 'closed') {
                    statusClass = 'bg-green-50 text-green-700 border-green-300';
                    statusText = 'ÄÃ£ nghiá»‡m thu';
                    iconClass = 'fa-check-circle';
                }

                return `
                <div onclick="viewJobDetails('${job.id}')" class="bg-white dark:bg-gray-800 dark:border-gray-700 p-6 rounded-2xl shadow-sm border border-gray-100 hover:shadow-xl hover:border-blue-300 transition cursor-pointer flex flex-col h-full group">
                    <div class="flex justify-between items-start mb-4">
                        <span class="px-3 py-1 rounded-full text-xs font-bold border flex items-center ${statusClass}"><i class="fas ${iconClass} mr-1"></i> ${statusText}</span>
                        <span class="text-xs text-gray-400 bg-gray-50 px-2 py-1 rounded border"><i class="far fa-calendar-alt mr-1"></i>${new Date(job.created_at).toLocaleDateString('vi-VN')}</span>
                    </div>
                    <h3 class="font-bold text-lg text-gray-800 dark:text-gray-100 mb-2 group-hover:text-blue-600 transition line-clamp-2">${job.title}</h3>
                    <p class="text-gray-500 dark:text-gray-400 text-sm mb-4 line-clamp-3 flex-grow">${job.description}</p>
                    <div class="pt-4 border-t border-gray-50 flex justify-between items-center mt-auto">
                        <span class="font-bold text-green-600"><i class="fas fa-coins mr-1"></i>${parseInt(job.budget).toLocaleString()} Token</span>
                        <span class="text-blue-500 text-sm group-hover:underline">Xem chi tiáº¿t <i class="fas fa-arrow-right text-xs ml-1"></i></span>
                    </div>
                </div>`;
            }).join('');
        }

        // Lá»c vÃ  TÃ¬m kiáº¿m
        document.getElementById('searchInput').addEventListener('input', applyFilters);
        document.getElementById('statusFilter').addEventListener('change', applyFilters);

        function applyFilters() {
            const searchText = document.getElementById('searchInput').value.toLowerCase();
            const statusVal = document.getElementById('statusFilter').value;

            const filtered = allJobs.filter(job => {
                const matchSearch = job.title.toLowerCase().includes(searchText) || job.description.toLowerCase().includes(searchText);
                const matchStatus = (statusVal === 'all') || (job.status === statusVal) || (statusVal === 'completed' && job.status === 'closed');
                return matchSearch && matchStatus;
            });
            renderJobs(filtered);
        }

        // Xem Chi tiáº¿t (Modal)
        function viewJobDetails(jobId) {
            const job = allJobs.find(j => j.id === jobId);
            if(!job) return;

            document.getElementById('detailTitle').textContent = job.title;
            document.getElementById('detailDate').textContent = new Date(job.created_at).toLocaleString('vi-VN');
            document.getElementById('detailBudget').textContent = parseInt(job.budget).toLocaleString();
            document.getElementById('detailDesc').textContent = job.description;

            const statusEl = document.getElementById('detailStatus');
            if (job.status === 'open') {
                statusEl.className = 'px-3 py-1 rounded-full text-sm font-bold border bg-blue-50 text-blue-700 border-blue-300';
                statusEl.innerHTML = '<i class="fas fa-door-open mr-1"></i> Äang má»Ÿ';
            } else if (job.status === 'in_progress') {
                statusEl.className = 'px-3 py-1 rounded-full text-sm font-bold border bg-yellow-50 text-yellow-700 border-yellow-300';
                statusEl.innerHTML = '<i class="fas fa-spinner fa-spin mr-1"></i> Äang thá»±c hiá»‡n';
            } else {
                statusEl.className = 'px-3 py-1 rounded-full text-sm font-bold border bg-green-50 text-green-700 border-green-300';
                statusEl.innerHTML = '<i class="fas fa-check-circle mr-1"></i> ÄÃ£ nghiá»‡m thu';
            }

            document.getElementById('detailModal').classList.remove('hidden');
        }

        function closeDetailModal() {
            document.getElementById('detailModal').classList.add('hidden');
        }

        // Modal ÄÄƒng Dá»± Ãn
        function openPostModal() { document.getElementById('postModal').classList.remove('hidden'); }
        function closePostModal() { document.getElementById('postModal').classList.add('hidden'); }

        // ÄÄƒng Dá»± Ãn Xá»­ lÃ½
        document.getElementById('postJobForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button[type="submit"]');
            btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>Äang xá»­ lÃ½...';
            btn.disabled = true;

            const payload = {
                client_id: document.getElementById('client_id').value,
                title: document.getElementById('title').value,
                description: document.getElementById('description').value,
                budget: document.getElementById('budget').value
            };

            try {
                const response = await fetch(`${API_URL}/api/jobs`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                const data = await response.json();
                const msgDiv = document.getElementById('postMessage');
                msgDiv.classList.remove('hidden');
                
                if (response.ok) {
                    msgDiv.textContent = data.message;
                    msgDiv.className = "mt-4 text-green-600 font-bold block";
                    document.getElementById('postJobForm').reset();
                    setTimeout(() => {
                        closePostModal();
                        msgDiv.classList.add('hidden');
                        loadJobs(); // Load láº¡i DS
                    }, 1500);
                } else {
                    msgDiv.textContent = 'Lá»—i: ' + data.error;
                    msgDiv.className = "mt-4 text-red-600 font-bold block";
                    
                    if (data.error.includes('Sá»‘ dÆ° vÃ­ khÃ´ng Ä‘á»§') || data.error.includes('KhÃ´ng tÃ¬m tháº¥y vÃ­')) {
                        setTimeout(() => {
                            if (confirm('Sá»‘ dÆ° Token cá»§a báº¡n khÃ´ng Ä‘á»§ Ä‘á»ƒ Ä‘Äƒng dá»± Ã¡n nÃ y. Báº¡n cÃ³ muá»‘n Ä‘i Ä‘áº¿n trang VÃ­ Ä‘á»ƒ náº¡p thÃªm Token khÃ´ng?')) {
                                window.location.href = 'wallet.html';
                            } else {
                                window.location.href = 'home.html';
                            }
                        }, 500);
                    }
                }
            } catch (err) {
                alert('KhÃ´ng thá»ƒ káº¿t ná»‘i Ä‘áº¿n Backend');
            } finally {
                btn.innerHTML = 'XÃ¡c nháº­n ÄÄƒng Dá»± Ãn';
                btn.disabled = false;
            }
        });

        // Dá»n dáº¹p Dá»± Ã¡n cÅ© (> 1 thÃ¡ng)
        async function cleanupOldJobs() {
            if(!confirm('HÃ nh Ä‘á»™ng nÃ y sáº½ xÃ³a cÃ¡c dá»± Ã¡n Ä‘Ã£ NGHIá»†M THU trÃªn 1 thÃ¡ng Ä‘á»ƒ giáº£i phÃ³ng dung lÆ°á»£ng. CÃ¡c dá»± Ã¡n Ä‘ang lÃ m sáº½ KHÃ”NG bá»‹ áº£nh hÆ°á»Ÿng. Báº¡n cÃ³ cháº¯c cháº¯n?')) return;
            
            try {
                const response = await fetch(`${API_URL}/api/jobs/cleanup/${currentUser.id}`, { method: 'DELETE' });
                const data = await response.json();
                if(response.ok) {
                    alert('ThÃ nh cÃ´ng: ' + data.message);
                    loadJobs();
                } else {
                    alert('Lá»—i: ' + data.error);
                }
            } catch (err) {
                alert('Lá»—i káº¿t ná»‘i server khi dá»n dáº¹p!');
            }
        }
    </script>

        </main>
    </div>
    
    <!-- Shared UI Script -->
    <script src="ui.js"></script>
